  if(STEP===4){
    if(mem)h=head+'<div class="k">Step 4 of 4</div><h2>Set up your <span>membership.</span></h2><p class="lead">'+E(p.n)+', '+E(String(p.term).toLowerCase())+', '+wk(p.wk)+'. The direct debit form opens in a new tab with the gym\'s provider'+(p.grp==="Recovery"?" (Mindbody)":" (Debitsuccess)")+'. Finish it, come back here and tap done.</p><div class="card"><div class="kv"><span>Membership</span><b>'+E(p.n)+'</b></div><div class="kv"><span>Term</span><b>'+E(p.term)+'</b></div><div class="kv"><span>Weekly</span><b style="color:var(--gold2);font-size:16px">'+wk(p.wk)+'</b></div><div class="kv"><span>Swipe pass</span><b>'+money(CFG.swipe_pass_cents||5000)+' · collect at the desk</b></div>'+(p.grp!=="Recovery"?'<div class="kv"><span>On the form</span><b>+$1.50/wk Debitsuccess fee · $15 set-up</b></div>':'')+'<div class="kv"><span>Referred by</span><b>'+E(P.host)+'</b></div></div><a class="btn" style="text-align:center;text-decoration:none" href="'+E(p.link)+'" target="_blank" rel="noopener">Open the direct debit form ›</a><button class="btn ghost" onclick="G.join()">Done, I\'ve set it up</button>';
    else if(tri)h=head+'<div class="k">Step 4 of 4</div><h2>Start your <span>trial.</span></h2><p class="lead">Seven days of everything: classes, the gym floor, Cornerman. You train on '+E(first(P.host))+'\'s swipe until you pick up your own pass from the desk. We\'ll be in touch with your app login.</p><div class="card"><div class="kv"><span>Trial starts</span><b>Today</b></div><div class="kv"><span>Ends</span><b>'+E(new Date(Date.now()+7*86400000).toLocaleDateString("en-AU",{weekday:"short",day:"numeric",month:"short"}))+'</b></div><div class="kv"><span>Swipe pass</span><b>Collect from the desk</b></div><div class="kv"><span>Referred by</span><b>'+E(P.host)+'</b></div></div><button class="btn" onclick="G.trial()">Start my 7-day trial</button>';
    else{var link=(CFG.shop||"https://www.legacygym.net")+"/cart/"+p.variant+":1?attributes[pass_token]="+encodeURIComponent(TOKEN)+"&attributes[pass_code]="+encodeURIComponent(P.code)+"&attributes[guest]="+encodeURIComponent((P.first||"")+" "+(P.last||""))+"&attributes[host]="+encodeURIComponent(P.host||"")+"&checkout[email]="+encodeURIComponent(P.email||"")+"&checkout[shipping_address][first_name]="+encodeURIComponent(P.first||"")+"&checkout[shipping_address][last_name]="+encodeURIComponent(P.last||"")+"&checkout[shipping_address][phone]="+encodeURIComponent(P.mobile||"");
      h=head+'<div class="k">Step 4 of 4</div><h2>Pay <span>'+money(p.cents)+'.</span></h2><p class="lead">Secure checkout through the Legacy Gym store (Apple Pay, Google Pay or card). Your receipt goes to '+E(P.email)+'. When it\'s paid, come back to this page and your pass appears.</p><div class="card"><div class="kv"><span>'+E(p.n)+'</span><b>'+money(p.cents)+'</b></div><div class="kv"><span>Guest of</span><b>'+E(P.host)+'</b></div><div class="kv"><span>Valid</span><b>Today only</b></div><div class="kv"><span>Total</span><b style="color:var(--gold2);font-size:16px">'+money(p.cents)+' AUD</b></div></div><a class="btn pay" href="'+E(link)+'" onclick="G.paying()">Pay '+money(p.cents)+' · Legacy store ›</a><button class="btn ghost" onclick="G.refresh()">I\'ve paid · refresh my pass</button><div id="payMsg" class="lead" style="font-size:11px;margin-top:10px">Pass code '+E(P.code)+' is attached to your order so it matches up by itself.</div>';}}
  if(STEP===5){var who=((P.first||"")+" "+(P.last||"")).trim();h=head+'<div class="pass"><div class="k">'+(mem?"Member · welcome to Legacy":paid?"Paid · you\'re in":"Trial active · you\'re in")+'</div><div class="code">'+E(P.code)+'</div>'+faceImg(P.photo,initials())+'<div style="font:700 18px/1.1 Oswald,sans-serif;text-transform:uppercase;margin-top:4px">'+E(who)+'</div><div style="font-size:12px;color:var(--muted);margin-top:4px">'+E(p.n)+' · guest of '+E(P.host)+' · '+E(new Date(P.valid_date+"T12:00:00").toLocaleDateString("en-AU",{day:"numeric",month:"short"}))+'</div><span class="tag">Waiver '+(P.waiver_verified?"confirmed":"signed")+(mem?" · "+wk(p.wk)+" · "+E(p.term):paid?" · "+money(P.paid_cents||p.cents)+" paid"+(P.order_name?" · "+E(P.order_name):""):" · 7 days")+'</span><div style="margin-top:14px;font-size:12.5px;line-height:1.55;color:#d0ccc2">'+(mem?"You\'re a member from today. Grab your swipe pass from the desk; until then walk in with "+E(first(P.host))+".":p.kind==="Day pass"?"All day with "+E(first(P.host))+": train, take a class, then the communal sauna and ice bath. Shower before recovery, swimwear and a towel.":p.kind==="Recovery"?"Head to the recovery centre with "+E(first(P.host))+". Shower first, swimwear on, towel in hand.":tri?"Walk in with "+E(first(P.host))+" today. We\'ll text you about your app login and your own pass.":"Walk in with "+E(first(P.host))+", they swipe you through. Pick any class today or hit the floor.")+'</div></div>'+
    '<div class="sharebox"><div class="k">Bring the crew</div><div style="font:700 18px/1.1 Oswald,sans-serif;text-transform:uppercase;margin:4px 0">'+(mem?"Tell your mates you joined":tri?"Get a mate on a trial too":"Next time, bring a mate")+'</div><div class="lead" style="margin:4px 0 0">One tap sends a message with your name and the link. Everyone 18+ is welcome; under-18s come in during open hours for classes.</div><div class="row"><button class="pri" onclick="G.share()">Share with mates</button><button onclick="G.refresh()">Refresh</button></div></div>'+
    (paid&&!mem?'<div class="card" style="margin-top:10px"><div class="k">Liked it?</div><div style="font:700 18px/1.1 Oswald,sans-serif;text-transform:uppercase;margin:4px 0">Join within 7 days</div><div class="lead" style="margin:4px 0 0">Ask at the desk about having today\'s '+money(p.cents)+' credited to a membership. '+E(first(P.host))+' gets the referral.</div><a class="btn ghost" style="text-align:center;text-decoration:none" href="https://www.legacygym.net/pages/memberships" target="_blank" rel="noopener">See memberships</a></div>':'');}
  app.innerHTML=h;window.scrollTo(0,0);
  if(STEP===3&&!P.has_photo)setTimeout(startCam,80);else stopCam();
  if(STEP===4&&!mem&&!tri)startPoll();else stopPoll();
}
function setStep(n){STEP=n;render();}
var G=window.G={};
G.tick=function(el){newTick=el.checked;$("goBtn").disabled=!newTick;};
G.go=function(){if(P.kind==="trial"&&!newTick)return;setStep(1);};
G.next=function(n){setStep(n);};
G.details=function(){if(busy)return;var f=$("fn").value.trim(),l=$("ln").value.trim(),m=$("fm").value.trim(),e=$("fe").value.trim();age18=$("age18").checked;
  if(!f||!l||!m||!e){toast("First name, last name, mobile and email please");return;}if(!age18){toast("You need to be 18 or over to use this pass");return;}
  busy=true;sb.rpc("guest_pass_details",{p_token:TOKEN,p:{first:f,last:l,mobile:m,email:e,age18:true}}).then(function(r){busy=false;var j=r.data||{};if(r.error||!j.ok){toast((j.error)||(r.error&&r.error.message)||"Try again");return;}return load().then(function(){setStep(2);});}).catch(function(){busy=false;toast("Connection hiccup, try again");});};
G.returning=function(){if(busy)return;var m=$("retMob").value.trim();if(m.replace(/\D/g,"").length<8){toast("Enter the mobile you used last time");return;}busy=true;
  sb.rpc("guest_pass_returning",{p_token:TOKEN,p_mobile:m}).then(function(r){busy=false;var j=r.data||{};if(r.error||!j.ok){toast(j.error||"Try again");return;}toast("Welcome back, "+j.first+(j.waiver_ok?". Waiver and photo on file":". Photo on file, one waiver to sign"));return load().then(function(){setStep(stepFor());});}).catch(function(){busy=false;toast("Connection hiccup, try again");});};
G.checkWaiver=function(){if(busy)return;busy=true;var b=$("chkBtn");if(b){b.disabled=true;b.textContent="Checking with Smartwaiver…";}
  fetch(SB_URL+"/functions/v1/guest-waiver?t="+encodeURIComponent(TOKEN)).then(function(r){return r.json();}).catch(function(){return {configured:false};}).then(function(j){
    if(j&&j.verified){busy=false;toast("Waiver confirmed");return load().then(function(){setStep(3);});}
    if(j&&j.configured){busy=false;if(b){b.disabled=false;b.textContent="I've signed · check again";}var msg=$("wvMsg");if(msg)msg.innerHTML='<div class="err">We can\'t see your signed waiver yet'+(j.missing&&j.missing.length>1?" (both are needed)":"")+'. Make sure you tapped <b>Agree</b> at the very bottom of the Smartwaiver page, then check again.</div>';return;}
    /* Smartwaiver check not switched on yet: record the signature as self-reported, staff confirm it */
    return sb.rpc("guest_pass_waiver_claim",{p_token:TOKEN}).then(function(r){busy=false;var k=r.data||{};if(r.error||!k.ok){if(b){b.disabled=false;b.textContent="I've signed · check";}toast(k.error||"Try again");return;}toast("Waiver recorded");return load().then(function(){setStep(3);});});
  }).catch(function(){busy=false;if(b){b.disabled=false;b.textContent="I've signed · check";}toast("Connection hiccup, try again");});};
/* camera + face check */
var cam={stream:null,det:null,detReady:false,timer:null,live:false,lastOk:false,pending:null};
function startCam(){var v=$("vid");if(!v||cam.live)return;if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setHint("No camera in this browser. Use the camera app button.",null);return;}
 navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:640},height:{ideal:800}},audio:false}).then(function(st){cam.stream=st;cam.live=true;v.srcObject=st;setHint("Centre your face",null);loadDet();cam.timer=setInterval(liveCheck,700);}).catch(function(){setHint("Camera blocked here. Use the camera app button.",null);});}
function stopCam(){clearInterval(cam.timer);cam.timer=null;if(cam.stream){cam.stream.getTracks().forEach(function(t){t.stop();});cam.stream=null;}cam.live=false;cam.lastOk=false;}
function setHint(t,ok){var h=$("camHint"),c=$("cam"),b=$("snap");if(h)h.textContent=t;if(c){c.classList.toggle("ok",ok===true);c.classList.toggle("bad",ok===false);}if(b)b.disabled=!(ok===true);}
function loadDet(){if(cam.det||!window.FaceDetection)return;try{cam.det=new FaceDetection({locateFile:function(f){return "https://cdn.jsdelivr.net/npm/@mediapipe/face_detection@0.4.1646425229/"+f;}});cam.det.setOptions({model:"short",minDetectionConfidence:0.6});cam.det.onResults(function(r){if(cam.pending)cam.pending(r);});cam.det.initialize().then(function(){cam.detReady=true;}).catch(function(){cam.det=null;});}catch(e){cam.det=null;}}
/* face check: MediaPipe when it loaded, the browser's FaceDetector when it exists, else a light brightness-and-skin check (backup only) */
function checkFace(src,w,h){return new Promise(function(res){
 if(cam.det&&cam.detReady){var done=false;cam.pending=function(r){if(done)return;done=true;cam.pending=null;var d=(r.detections||[])[0];if(!d){res({ok:false,why:"No face found. It needs to be you, not the wall."});return;}var bb=d.boundingBox;res(bb&&bb.width<0.18?{ok:false,why:"Come closer and fill the oval."}:{ok:true,how:"MediaPipe"});};
   cam.det.send({image:src}).catch(function(){if(!done){done=true;cam.pending=null;res(heur(src,w,h));}});setTimeout(function(){if(!done){done=true;cam.pending=null;res(heur(src,w,h));}},1500);return;}
 if(window.FaceDetector){try{new FaceDetector({fastMode:true,maxDetectedFaces:1}).detect(src).then(function(f){res(f.length?{ok:true,how:"FaceDetector"}:{ok:false,why:"No face found. It needs to be you, not the wall."});}).catch(function(){res(heur(src,w,h));});return;}catch(e){}}
 res(heur(src,w,h));});}
function heur(src,w,h){var c=document.createElement("canvas");c.width=96;c.height=120;var x=c.getContext("2d");try{x.drawImage(src,0,0,96,120);}catch(e){return {ok:false,why:"Couldn't read the picture. Try again."};}
 var d=x.getImageData(0,0,96,120).data,skin=0,n=0,sum=0,sq=0;for(var i=0;i<d.length;i+=4){var r=d[i],g=d[i+1],b=d[i+2],px=i/4,xx=px%96,yy=Math.floor(px/96),l=(r*299+g*587+b*114)/1000;sum+=l;sq+=l*l;if(xx>20&&xx<76&&yy>20&&yy<100){n++;var cb=128-0.168736*r-0.331264*g+0.5*b,cr=128+0.5*r-0.418688*g-0.081312*b;if(cr>135&&cr<175&&cb>80&&cb<125&&r>g&&r>b)skin++;}}
 var N=d.length/4,sd=Math.sqrt(Math.max(0,sq/N-(sum/N)*(sum/N))),ratio=skin/n;if(sd<16)return {ok:false,why:"That looks like a wall or a blank surface. We need your face."};if(ratio<0.14)return {ok:false,why:"No face found. Centre your face in the oval."};return {ok:true,how:"backup check"};}
function liveCheck(){var v=$("vid");if(!v||!cam.live||v.readyState<2)return;checkFace(v,v.videoWidth,v.videoHeight).then(function(r){cam.lastOk=r.ok;setHint(r.ok?"Face found. Hold still":r.why,r.ok);});}
window.snap=function(){var v=$("vid");if(!v||!cam.lastOk){toast("Get your face in the oval first");return;}var c=document.createElement("canvas");c.width=360;c.height=450;var x=c.getContext("2d"),vw=v.videoWidth,vh=v.videoHeight,s=Math.max(360/vw,450/vh);x.translate(360,0);x.scale(-1,1);x.drawImage(v,(360-vw*s)/2,(450-vh*s)/2,vw*s,vh*s);acceptPhoto(c.toDataURL("image/jpeg",.7));};
window.fromFile=function(inp){var f=inp.files&&inp.files[0];if(!f)return;var img=new Image();img.onload=function(){checkFace(img,img.naturalWidth,img.naturalHeight).then(function(r){if(!r.ok){setHint(r.why,false);toast(r.why);return;}var c=document.createElement("canvas");c.width=360;c.height=450;var x=c.getContext("2d"),s=Math.max(360/img.naturalWidth,450/img.naturalHeight);x.drawImage(img,(360-img.naturalWidth*s)/2,(450-img.naturalHeight*s)/2,img.naturalWidth*s,img.naturalHeight*s);acceptPhoto(c.toDataURL("image/jpeg",.7));});};img.src=URL.createObjectURL(f);};

function acceptPhoto(url){stopCam();if(busy)return;busy=true;toast("Saving photo…");sb.rpc("guest_pass_photo",{p_token:TOKEN,p_data:url}).then(function(r){busy=false;var j=r.data||{};if(r.error||!j.ok){toast(j.error||"Photo didn't save, try again");render();return;}buzz(15);return load().then(function(){render();});}).catch(function(){busy=false;toast("Connection hiccup, try again");render();});}
G.snap=window.snap;G.fromFile=window.fromFile;
G.retake=function(){P.has_photo=false;P.photo=null;render();};
G.trial=function(){if(busy)return;busy=true;sb.rpc("guest_pass_trial_start",{p_token:TOKEN}).then(function(r){busy=false;var j=r.data||{};if(r.error||!j.ok){toast(j.error||(r.error&&r.error.message)||"Try again");return;}buzz([20,30,20]);return load().then(function(){setStep(5);});}).catch(function(){busy=false;toast("Connection hiccup, try again");});};
G.join=function(){if(busy)return;busy=true;sb.rpc("guest_pass_join_claim",{p_token:TOKEN}).then(function(r){busy=false;var j=r.data||{};if(r.error||!j.ok){toast(j.error||"Try again");return;}buzz([20,30,20]);return load().then(function(){setStep(5);});}).catch(function(){busy=false;toast("Connection hiccup, try again");});};
G.paying=function(){try{localStorage.setItem("lg_guest_paying",TOKEN);}catch(e){}};
G.refresh=function(){load().then(function(){var s=stepFor();if(s===5&&STEP!==5)buzz([20,30,20]);if(s>STEP||s===5)setStep(s);else toast(P.paid?"Paid":"Not paid yet. Give it a few seconds.");}).catch(function(){toast("Connection hiccup");});};
G.share=function(){var p=prod(),name=P.first||"I",kind=P.kind;var text=kind==="membership"?name+" just signed up at Legacy Gym Kincumber. Come train with me: https://www.legacygym.net/pages/start-your-free-trial":kind==="trial"?name+" just started a free 7-day trial at Legacy Gym Kincumber. Grab yours too: https://www.legacygym.net/pages/start-your-free-trial":name+" just did a "+String(p.n||"session").toLowerCase()+" at Legacy Gym Kincumber. Come with me next time: https://www.legacygym.net/pages/start-your-free-trial";
  if(navigator.share){navigator.share({title:"Legacy Gym",text:text}).catch(function(){});}else{try{navigator.clipboard.writeText(text);}catch(e){}toast("Message copied, paste it to your mates");}};
function startPoll(){stopPoll();pollT=setInterval(function(){if(document.hidden)return;load().then(function(){if(stepFor()===5){stopPoll();buzz([20,30,20]);setStep(5);}}).catch(function(){});},5000);}
function stopPoll(){clearInterval(pollT);pollT=null;}
document.addEventListener("visibilitychange",function(){if(!document.hidden&&P&&STEP>=4)G.refresh();});
if(!TOKEN){P=null;render();}
else load().then(function(){STEP=stepFor();render();}).catch(function(e){P=null;render();});
})();
</script>
