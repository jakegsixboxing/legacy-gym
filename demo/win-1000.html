<style>

.demo button.on{background:#f5b942;color:#2a2211}
.wrap{max-width:460px;margin:0 auto;padding:0 18px 40px}

.bar{display:flex;align-items:center;justify-content:space-between;padding:16px 0 6px}

.hero.photo::after{display:none}
.hero.photo .lede{color:#efe7d8;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.hero.photo .win,.hero.photo .cashlbl{text-shadow:0 4px 18px rgba(0,0,0,.75)}
.hero.story{min-height:calc(100svh - 120px);display:flex;flex-direction:column;justify-content:center;padding:30px 22px 26px}
.hero{position:relative;margin-top:10px;border-radius:24px;overflow:hidden;border:1px solid #3d3218;background:radial-gradient(120% 80% at 50% 0%,#3d2f10 0%,#16120a 55%,#0b0a08 100%);padding:26px 22px 22px;text-align:center}
.hero::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(244,201,93,.05) 0 2px,transparent 2px 14px);pointer-events:none}
.eb{font:600 11px/1 Oswald,sans-serif;letter-spacing:4px;text-transform:uppercase;color:var(--g2)}
.cash{font:700 104px/.9 Oswald,sans-serif;letter-spacing:-1px;margin:14px 0 2px;background:linear-gradient(180deg,var(--g3) 0%,var(--g2) 45%,#b8892c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 10px 40px rgba(244,201,93,.25);font-variant-numeric:tabular-nums}
.cash sup{font-size:.42em;vertical-align:.95em;margin-right:2px}
.comp{display:inline-flex;align-items:center;gap:8px;font:700 11px/1 Oswald,sans-serif;letter-spacing:4px;text-transform:uppercase;color:#161307;background:linear-gradient(180deg,var(--g2),var(--g));border-radius:99px;padding:8px 14px;margin:0 auto}
.win{font:700 64px/.9 Oswald,sans-serif;letter-spacing:6px;color:#fff;margin-top:18px;text-transform:uppercase}
.shine{position:relative;display:inline-block}
.shine::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%{background-position:150% 0}60%,100%{background-position:-60% 0}}
.fn{margin:18px auto 0;display:inline-grid;gap:4px;border:1px solid #5a4719;background:rgba(0,0,0,.4);border-radius:14px;padding:10px 16px}
.fn b{font:700 15px/1 Oswald,sans-serif;letter-spacing:2px;text-transform:uppercase;color:#fff}
.fn small{font:700 10px/1 Montserrat,sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:var(--g2)}
.elig{margin-top:12px;display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;background:#15120a;border:1px solid #3d3218;border-radius:14px;padding:12px 14px;font-size:12px;line-height:1.5;color:#ddd6c8}
.elig i{font-style:normal;color:var(--g2);font-size:15px;line-height:1.2}
.elig b{color:#fff}
.lock{margin-top:14px;border-radius:16px;border:1px solid #6b5520;background:linear-gradient(160deg,#241c0b,#0f0e0b);padding:14px}
.lock .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lock .hd b{font:600 16px/1.1 Oswald,sans-serif;text-transform:uppercase;color:#fff}
.lock .hd span{font:700 11px/1 Oswald,sans-serif;letter-spacing:1.5px;color:var(--g2);text-transform:uppercase}
.lock p{font-size:12px;color:#cfc7b4;line-height:1.5;margin-top:6px}
.week7{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.week7 i{height:34px;border-radius:9px;border:1px dashed #5a4719;display:grid;place-items:center;font:700 11px/1 Oswald,sans-serif;font-style:normal;color:var(--mu)}
.week7 i.on{border:0;background:var(--ok);color:#06240f}
.ticket.pending{background:linear-gradient(160deg,#5a4a20,#3b3016 55%,#2a2210);color:#f4e7c4}
.ticket .stamp{position:absolute;right:14px;top:14px;font:700 10px/1 Oswald,sans-serif;letter-spacing:2px;text-transform:uppercase;border:2px solid currentColor;border-radius:8px;padding:6px 8px;transform:rotate(6deg);opacity:.85}
.cashlbl{font:700 22px/1 Oswald,sans-serif;letter-spacing:6px;text-transform:uppercase;color:#fff}
.lede{font-size:13.5px;line-height:1.55;color:#ddd6c8;margin:14px auto 0;max-width:32ch}
.lede b{color:#fff}
.cd{display:flex;justify-content:center;gap:8px;margin-top:18px}
.cd div{min-width:58px;background:rgba(0,0,0,.45);border:1px solid #3d3218;border-radius:12px;padding:8px 6px}
.cd b{display:block;font:600 24px/1 Oswald,sans-serif;font-variant-numeric:tabular-nums}
.cd small{display:block;font:800 8.5px/1 Montserrat,sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:var(--mu);margin-top:5px}
.drawlbl{font-size:11px;color:var(--mu);margin-top:10px;letter-spacing:.3px}
.how{display:grid;gap:8px;margin-top:16px}
.how div{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;background:var(--p);border:1px solid var(--ln);border-radius:14px;padding:12px}
.how i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font:700 15px/1 Oswald,sans-serif;font-style:normal;color:#161307;background:var(--g)}
.how b{display:block;font:600 15px/1.1 Oswald,sans-serif;text-transform:uppercase;letter-spacing:.3px}
.how small{display:block;font-size:11.5px;color:var(--mu);margin-top:3px;line-height:1.4}
/* buttons */
.cta{display:block;width:100%;margin-top:16px;padding:17px;border:0;border-radius:15px;background:linear-gradient(180deg,var(--g2),var(--g));color:#161307;font:700 16px/1 Oswald,sans-serif;letter-spacing:2.5px;text-transform:uppercase;box-shadow:0 10px 30px rgba(201,164,76,.25)}
.cta:disabled{opacity:.45;box-shadow:none;cursor:default}
.ghost{display:block;width:100%;margin-top:10px;padding:14px;border-radius:15px;background:none;border:1px solid var(--ln);color:var(--mu);font:700 12px/1 Oswald,sans-serif;letter-spacing:1.8px;text-transform:uppercase}
.fine{font-size:10.5px;color:#6f6b63;text-align:center;line-height:1.55;margin-top:14px}
.fine a{color:var(--mu)}
/* forms */
.h2{font:700 30px/1.05 Oswald,sans-serif;text-transform:uppercase;margin-top:14px;text-wrap:balance}
.h2 span{color:var(--g2)}
.sub{font-size:13px;color:var(--mu);line-height:1.55;margin-top:8px}

  var m=S.mates[i],nm=m.n.trim();
  if(nm.length<2){toast("Pop in their first name first.");var el=$("m"+i);if(el){el.classList.add("bad");el.focus();}return;}
  var dup=S.mates.some(function(x,j){return j!==i&&x.sent&&x.n.trim().toLowerCase()===nm.toLowerCase();});
  if(dup){toast("You've already sent one to "+nm+". Three different mates.");return;}
  var L={sms:"text",wa:"WhatsApp",ig:"Instagram",ms:"Messenger",more:"share"}[how];
  /* real version: opens the app with the message filled in; the demo just records it */
  m.sent=L;toast("Sent to "+nm.split(" ")[0]+" by "+L+" (demo)");
  if(sentN()===3){S.entry=1000+Math.floor(Math.random()*400);setTimeout(function(){go("done");boom();},650);}else render();
};
function trialDone(){return !!S.trialComplete;}
function locked(){return S.member||trialDone();}
function done(){
  var lk=locked(),d=S.trialDay?new Date(S.trialDay+"T12:00:00"):null,end=d?new Date(d.getTime()+6*864e5):null;
  var h=bar(0)+'<div class="fade"><h1 class="h2">'+(lk?'You\'re <span>in</span>, '+E(first()):'Nearly there, <span>'+E(first())+'</span>')+'</h1>'
   +'<p class="sub">'+(lk?'Your entry is locked in. We\'ll call '+E(S.mobile)+' if your name comes out at <b>Fight Night, Saturday 19 December</b>.':'Your three mates are sent. Finish your free week and your entry locks in for the draw at <b>Fight Night, 19 December</b>.')+'</p>'
   +'<div class="ticket'+(lk?'':' pending')+'"><div class="stamp">'+(lk?'Entry locked':'Pending')+'</div><div class="k">Legacy Gym · Win $1000 cash</div><div class="t">'+E(S.name)+'</div>'
   +'<div class="row"><div><small>Entry no.</small><b>#'+S.entry+'</b></div><div><small>Entries</small><b>'+entries()+'</b></div><div><small>Drawn</small><b>19 Dec</b></div></div></div>';
  if(!lk){var dn=S.daysIn||0;
    h+='<div class="lock"><div class="hd"><b>Finish your free week</b><span>'+dn+' of 7 days</span></div><p>Your week runs <b style="color:#fff">'+d.toLocaleDateString("en-AU",{weekday:"short",day:"numeric",month:"short"})+' – '+end.toLocaleDateString("en-AU",{weekday:"short",day:"numeric",month:"short"})+'</b>. Swipe in and train, and the day it finishes your entry locks in.</p>'
     +'<div class="week7">'+[0,1,2,3,4,5,6].map(function(i){return '<i class="'+(i<dn?'on':'')+'">'+(i<dn?'✓':'D'+(i+1))+'</i>';}).join("")+'</div>'
     +'<button class="ghost" onclick="simDay()">Demo: fast-forward a day</button></div>';}
  h+='<div class="boost"><div class="hd"><b>Stack more entries</b><span>+1 per mate</span></div><p>Every mate who claims their free week through your link puts <b style="color:#fff">another entry</b> in with your name on it. No limit.</p>'
   +'<div class="link"><code>'+E(link())+'</code><button onclick="copyLink()">Copy</button></div>'
   +'<div class="feed">'+S.mates.map(function(m){var c=S.claims.indexOf(m.n)>=0;return '<div><span>'+E(m.n.split(" ")[0])+' · sent by '+E(m.sent)+'</span><em class="'+(c?'':'w')+'">'+(c?'Claimed · +1 entry':'Waiting')+'</em></div>';}).join("")+'</div>'
   +'<button class="ghost" onclick="simClaim()">Demo: pretend a mate claims their week</button></div>'
   +'<button class="cta" onclick="moreMates()">Send more mates a free week</button>'
   +'<div class="fine">Screenshot your ticket. Drawn live at Legacy Gym Fight Night, Saturday 19 December.</div></div>';
  return h;
}
window.simDay=function(){S.daysIn=Math.min(7,(S.daysIn||0)+1);if(S.daysIn===7){S.trialComplete=true;toast("Free week done · your entry is locked in");boom();}render();};
window.copyLink=function(){try{navigator.clipboard.writeText("https://"+link());}catch(e){}toast("Your link's copied.");};
window.simClaim=function(){var w=S.mates.filter(function(m){return S.claims.indexOf(m.n)<0;})[0];if(!w){toast("All three have claimed. Send more mates for more entries.");return;}S.claims.push(w.n);toast(w.n.split(" ")[0]+" claimed their free week · +1 entry");render();};
window.moreMates=function(){S.xn="";go("extra");};
function extra(){return bar(0)+'<div class="fade"><h1 class="h2">One more <span>mate</span></h1><p class="sub">Every mate who claims their free week adds an entry to your name. No limit.</p>'
   +'<div class="mate"><div class="hd"><i>+</i><b>Another mate</b></div><input id="xN" placeholder="Their first name" autocomplete="off" value="'+E(S.xn||"")+'" oninput="S_x(this.value)"><div class="chan">'
   +['sms','wa','ig','ms','more'].map(function(c){var L={sms:"Text",wa:"WhatsApp",ig:"Insta",ms:"Messenger",more:"More"}[c],I={sms:"💬",wa:"🟢",ig:"📸",ms:"✈️",more:"⋯"}[c];return '<button onclick="sendExtra(\''+c+'\')"><i class="c-'+c+'">'+I+'</i><small>'+L+'</small></button>';}).join("")+'</div></div>'
   +'<div class="preview"><b>What they\'ll get</b>'+E(msgFor(S.xn||"")).replace(E(link()),'<u>'+E(link())+'</u>')+'</div>'
   +'<button class="ghost" onclick="go(\'done\')">‹ Back to my ticket</button></div>';}
window.S_x=function(v){S.xn=v;var pv=document.querySelector(".preview");if(pv)pv.innerHTML='<b>What they\'ll get</b>'+E(msgFor(v)).replace(E(link()),'<u>'+E(link())+'</u>');};
window.sendExtra=function(how){var nm=(S.xn||"").trim();if(nm.length<2){toast("Their first name first.");var el=$("xN");if(el){el.classList.add("bad");el.focus();}return;}
  var L={sms:"text",wa:"WhatsApp",ig:"Instagram",ms:"Messenger",more:"share"}[how];S.mates.push({n:nm,sent:L});S.xn="";toast("Sent to "+nm+" by "+L+" (demo)");render();};

/* ---------- FRIEND LANDING ---------- */
function friend(){
  var from=S.name||"Jake Williamson",f=from.split(" ")[0];
  return bar(0)+'<div class="fade"><div class="inv"><i>'+E(f[0])+'</i><span><b>'+E(f)+'</b> sent you this. They train at Legacy Gym Kincumber.</span></div>'
   +'<div class="hero photo" style="margin-top:12px;padding:26px 20px 22px"><div class="eb">Join your mate</div><div class="win" style="font-size:44px;margin-top:12px">7 days free</div>'
   +'<div style="font:700 22px/1 Oswald,sans-serif;letter-spacing:5px;color:#fff;margin-top:14px;text-transform:uppercase">and win</div><div class="cash shine" style="font-size:86px;margin-top:6px"><sup>$</sup>1000</div>'
   +'<p class="lede">Train with '+E(f)+' all week, every class, no card. Finish your free week and you\'re in the draw too, <b>live at Fight Night, Saturday 19 December</b>.</p></div>'
   +'<label for="gN">Full name</label><input id="gN" placeholder="First and last" autocomplete="name">'
   +'<label for="gE">Email</label><input id="gE" type="email" inputmode="email" placeholder="you@email.com" autocomplete="email">'
   +'<label for="gM">Mobile</label><input id="gM" type="tel" inputmode="tel" placeholder="04…" autocomplete="tel">'
   +'<button class="cta" onclick="friendClaim()">Claim my free week</button>'
   +'<div class="fine">Claiming gives '+E(f)+' an extra entry. Send three mates of your own after and you get your own entry too.</div></div>';
}
window.friendClaim=function(){toast("Free week claimed (demo) · "+(S.name||"Jake").split(" ")[0]+" just got +1 entry");boom();};

/* ---------- STAFF VIEW ---------- */
var SAMPLE=[["Harley Dimech","m",3,4,1],["Sarah Nguyen","t",3,2,1],["Tom Williams","m",3,1,1],["Kelsey Waugh","m",3,3,1],["Josh Reid","t",3,0,0],["Mia Pal","m",3,2,1],["Corey Mear","m",2,0,1]];
function staff(){
  var ent=SAMPLE.filter(function(r){return r[2]>=3&&r[4];}),tick=ent.reduce(function(a,r){return a+1+r[3];},0),trials=SAMPLE.filter(function(r){return r[1]==="t";}).length+SAMPLE.reduce(function(a,r){return a+r[3];},0);
  return bar(0)+'<div class="fade"><h1 class="h2">Win $1000 · <span>Jake &amp; Ali</span></h1><p class="sub">Lives in the app under Ticket Release, next to Sponsorship inquiries. Only you two can see it.</p>'
   +'<div class="kpis"><div><b>'+ent.length+'</b><small>In the draw</small></div><div><b>'+tick+'</b><small>Total entries</small></div><div><b>'+trials+'</b><small>Free trials claimed</small></div></div>'
   +'<div class="tbl"><div class="r h"><span>Entrant</span><span></span><span>Entries</span></div>'
   +SAMPLE.map(function(r){var inn=r[2]>=3&&r[4];return '<div class="r"><span><b>'+r[0]+'</b><small>'+(r[2]<3?r[2]+' of 3 sent · not in yet':!r[4]?'3 sent · trial day 3 of 7 · pending':'3 mates sent')+(r[3]?' · '+r[3]+' mate'+(r[3]>1?'s':'')+' claimed':'')+'</small></span><span class="pill '+r[1]+'">'+(r[1]==="m"?'Member':'New · trial')+'</span><span class="num">'+(inn?1+r[3]:'–')+'</span></div>';}).join("")+'</div>'
   +'<button class="cta" onclick="drawIt()">Draw a winner (demo)</button>'
   +'<div class="fine">Only members and people who have finished their free week go in the barrel. Every free trial claimed through a link lands in Free trial sign-ups with "via Harley" etc, so the desk knows who referred who.</div></div>';
}
window.drawIt=function(){var pool=[];SAMPLE.forEach(function(r){if(r[2]>=3&&r[4])for(var i=0;i<1+r[3];i++)pool.push(r[0]);});var w=pool[Math.floor(Math.random()*pool.length)];toast("Winner: "+w+" (demo draw, weighted by entries)");boom();};

/* ---------- confetti ---------- */
function boom(){try{if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;var c=$("cf"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;var P=[];for(var i=0;i<140;i++)P.push({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*12-4,s:Math.random()*6+4,r:Math.random()*6,c:["#f4c95d","#c9a44c","#fff1c2","#ffffff","#4bc97a"][i%5]});var t=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(function(p){p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();});if(++t<120)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height);})();}catch(e){}}

/* ---------- router ---------- */
function render(){var a=$("app");
  if(S.v==="friend")a.innerHTML=friend();
  else if(S.v==="staff")a.innerHTML=staff();
  else a.innerHTML={hero:hero,details:details,member:member,trial:trial,share:share,done:done,extra:extra}[S.step]();
}
window.go=function(s){S.step=s;render();window.scrollTo({top:0,behavior:"smooth"});};
window.view=function(v){S.v=v;["entrant","friend","staff"].forEach(function(k){$("v"+k[0].toUpperCase()+k.slice(1)).classList.toggle("on",k===v);});render();window.scrollTo(0,0);};
render();
})();
</script>
</body></html>
