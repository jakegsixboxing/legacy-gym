<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Braiden Griggs · Fight Night · Hold me a ticket</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#06080a">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Fight Club Central Coast">
<meta property="og:title" content="Braiden Griggs · Fight Night · Dec 19">
<meta property="og:description" content="Hold me a ticket — first shot at tickets before they sell out, at the pre-sale discount. Nothing to pay today.">
<meta property="og:image" content="https://legacygym-app.vercel.app/img/fc/posters/braiden-griggs.jpg">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="1500">
<meta property="og:url" content="https://legacygym-app.vercel.app/demo/hold-braiden">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Braiden Griggs · Fight Night · Dec 19">
<meta name="twitter:image" content="https://legacygym-app.vercel.app/img/fc/posters/braiden-griggs.jpg">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Montserrat:wght@500;600;700;800&display=swap">
<style>
:root{--bg:#06080a;--panel:#0b1319;--panel2:#07141b;--line:#16303c;--ink:#eef3f5;--mute:#8fa4ae;--c:#1fb6e6;--c2:#7fe0ff;--green:#39FF88;--amber:#f5b942;--red:#ff6b7a;--shadow:0 18px 50px rgba(0,0,0,.55)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Montserrat,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:30px}
body.nodock{padding-bottom:30px}
button{font-family:inherit;cursor:pointer}
.oz{font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:.5px}
.k{font-size:10px;font-weight:800;letter-spacing:2.4px;text-transform:uppercase;color:var(--c)}
.mute{color:var(--mute)}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}

/* demo controls */
.demo{position:fixed;top:0;left:0;right:0;z-index:40;background:#0b1319;border-bottom:1px solid var(--line);padding:8px 14px;font-size:11px}
.demo .row{max-width:1040px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.demo b{color:var(--amber);letter-spacing:2px;font-size:10px}
.seg{display:flex;background:#07141b;border:1px solid var(--line);border-radius:99px;padding:3px}
.seg button{background:none;border:0;color:var(--mute);font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:6px 11px;border-radius:99px}
.seg button.on{background:var(--c);color:#04141b}
.weeks{display:flex;gap:4px;background:#07141b;border:1px solid var(--line);border-radius:12px;padding:4px}
.weeks button{background:none;border:0;color:var(--mute);font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:6px 9px;border-radius:9px;white-space:nowrap}
.weeks button.on{background:#15323f;color:var(--c2)}
.top{height:98px}
@media(min-width:720px){.top{height:56px}}

/* bar */
.bar{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px}
.bar img{height:44px}
.bar .ev{text-align:right}
.bar .ev .k{display:block}
.bar .ev .t{font:600 15px/1 Oswald,sans-serif;text-transform:uppercase;margin-top:4px}
.bar .ev .cd{font-size:11px;color:var(--mute);margin-top:3px;font-variant-numeric:tabular-nums}
.phase{display:inline-flex;align-items:center;gap:7px;background:#0d2430;border:1px solid #1b5b70;color:var(--c2);font-size:10px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;padding:6px 10px;border-radius:99px;margin:6px 0 2px}
.phase i{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px rgba(31,182,230,.18)}
.phase.live i{background:var(--red);box-shadow:0 0 0 3px rgba(255,107,122,.22);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,107,122,0)}}

.grid{display:grid;gap:18px}
@media(min-width:900px){.grid{grid-template-columns:420px 1fr;align-items:start}.sticky{position:sticky;top:70px}}

/* hero */
.hero{position:relative;border-radius:22px;overflow:hidden;background:#07141b;border:1px solid var(--line);box-shadow:var(--shadow)}
.hero img{display:block;width:100%;aspect-ratio:4/5;object-fit:contain;background:#06080a}
.meta2{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:12px;padding:0 4px;font-size:12px;color:#cfdbe0}
.meta2 b{color:#fff}
.meta2 .num{display:inline-block;background:var(--c);color:#04141b;font:700 11px/1 Oswald,sans-serif;letter-spacing:2px;padding:5px 8px;border-radius:6px}
.hero .fade{position:absolute;inset:auto 0 0 0;height:72%;background:linear-gradient(180deg,rgba(6,8,10,0) 0%,rgba(6,8,10,.72) 40%,rgba(6,8,10,.97) 100%)}
.hero .lg{position:absolute;top:14px;left:14px;height:38px;opacity:.95}
.hero .txt{position:absolute;left:18px;right:18px;bottom:18px}
.hero .num{display:inline-block;background:var(--c);color:#04141b;font:700 12px/1 Oswald,sans-serif;letter-spacing:2px;padding:6px 9px;border-radius:7px}
.hero h1{font:600 46px/.95 Oswald,sans-serif;text-transform:uppercase;letter-spacing:.5px;margin-top:10px;text-wrap:balance}
.hero h1 span{color:var(--c2)}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:#cfdbe0}
.hero .meta b{color:#fff}
.camp{display:flex;align-items:center;gap:10px;margin-top:12px;background:rgba(7,20,27,.75);border:1px solid var(--line);border-radius:12px;padding:9px 11px;backdrop-filter:blur(6px)}
.camp .bar2{flex:1;height:6px;background:#0d222c;border-radius:99px;overflow:hidden}
.camp .bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--c),var(--c2))}
.camp small{font-size:11px;font-weight:700;color:var(--c2);white-space:nowrap}
.vs{margin-top:12px;background:rgba(7,20,27,.8);border:1px solid #1b5b70;border-radius:12px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.vs b{font:600 15px/1 Oswald,sans-serif;text-transform:uppercase}
.vs small{display:block;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mute);font-weight:800;margin-top:3px}
.vs .v{font:700 18px/1 Oswald,sans-serif;color:var(--c2)}

/* corner */
.corner{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.corner .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.corner .n{font:600 30px/1 Oswald,sans-serif}
.corner .n small{font:700 11px/1 Montserrat,sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:var(--mute);margin-left:6px}
.avs{display:flex;margin-top:10px}
.avs i{width:30px;height:30px;border-radius:50%;border:2px solid var(--panel);margin-left:-8px;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:800;color:#06141b}
.avs i:first-child{margin-left:0}
.avs i.more{background:#15323f;color:var(--c2)}
.corner p{font-size:12px;color:var(--mute);margin-top:8px;line-height:1.5}
.corner p b{color:var(--ink)}
.caps{margin-top:10px;display:grid;gap:5px}
.cap{display:flex;align-items:center;gap:9px;font-size:12px;background:#07141b;border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.cap i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:9px;font-weight:800;color:#06141b}
.cap b{flex:1}
.cap .pill{font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--amber);border:1px solid #5a4a1f;border-radius:99px;padding:3px 7px}

/* sections */
.sec{margin-top:22px}
.sec h2{font:600 22px/1 Oswald,sans-serif;text-transform:uppercase;letter-spacing:.5px}
.sec .sub{font-size:12.5px;color:var(--mute);margin-top:5px;line-height:1.5;max-width:60ch}
.notice{margin-top:14px;background:#0d2430;border:1px solid #1b5b70;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.5}
.notice b{color:var(--c2)}
.notice.live{background:#2a0f14;border-color:#6b2430}.notice.live b{color:var(--red)}
.notice.win{background:#0f2a1c;border-color:#1f5a3a}.notice.win b{color:var(--green)}

/* actions */
.acts{display:grid;gap:10px;margin-top:14px}
.act{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;color:var(--ink);width:100%;transition:border-color .15s,transform .15s}
.act:hover{border-color:#2a5566;transform:translateY(-1px)}
.act.hot{border-color:#1b5b70;background:linear-gradient(180deg,#0c1a22,#0b1319)}
.act .ic{width:52px;height:52px;border-radius:14px;background:#0e2430;display:grid;place-items:center}
.act .ic svg{width:26px;height:26px;stroke:var(--c2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.act .t{font:600 18px/1.05 Oswald,sans-serif;text-transform:uppercase}
.act .d{font-size:12px;color:var(--mute);margin-top:4px;line-height:1.45}
.act .d b{color:var(--c2)}
.act .go{font:700 13px/1 Oswald,sans-serif;letter-spacing:1.5px;color:var(--c2);white-space:nowrap}
.seats{display:flex;gap:3px;margin-top:8px}
.seats i{flex:1;height:5px;border-radius:99px;background:#15323f}
.seats i.on{background:var(--c)}
.seats i.me{background:var(--green)}

/* tiers inline (box office) */
.tiers{display:grid;gap:8px;margin-top:14px}
.tier{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 14px;text-align:left;color:var(--ink)}
.tier.on{border-color:var(--c);background:#0d2430}
.tier b{display:block;font:600 17px/1 Oswald,sans-serif;text-transform:uppercase}
.tier small{display:block;font-size:11.5px;color:var(--mute);margin-top:4px;line-height:1.4}
.tier .pr{font:600 22px/1 Oswald,sans-serif;color:var(--c2);text-align:right}
.tier .pr s{display:block;font-size:12px;color:var(--mute);font-weight:500}
.tier .left{font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--amber);font-weight:800;margin-top:4px;display:block}

/* stats + timeline */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center}
.stat b{display:block;font:600 24px/1 Oswald,sans-serif;font-variant-numeric:tabular-nums}
.stat small{display:block;font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mute);margin-top:5px;font-weight:800}
.tl{margin-top:14px;border-left:2px solid var(--line);padding-left:16px;display:grid;gap:14px}
.tl .it{position:relative}
.tl .it:before{content:"";position:absolute;left:-23px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--line);border:2px solid var(--bg)}
.tl .it.now:before{background:var(--c);box-shadow:0 0 0 4px rgba(31,182,230,.18)}
.tl .w{font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--c)}
.tl .h{font-weight:700;font-size:14px;margin-top:3px}
.tl .b{font-size:12.5px;color:var(--mute);margin-top:3px;line-height:1.5}
.tl .coach{margin-top:7px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:10px;padding:9px 11px;font-size:12.5px;line-height:1.5;color:#d6e0e4}
.tl .coach b{display:block;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--c2);margin-bottom:3px}
.clip{margin-top:7px;aspect-ratio:16/9;border-radius:10px;background:linear-gradient(135deg,#0d2430,#07141b);border:1px solid var(--line);display:grid;place-items:center;color:var(--c2);font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}

/* song vote */
.vote{display:grid;gap:6px;margin-top:12px}
.vopt{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;color:var(--ink);position:relative;overflow:hidden}
.vopt .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(31,182,230,.12)}
.vopt b{position:relative;font-size:13px}.vopt small{position:relative;display:block;font-size:11px;color:var(--mute)}
.vopt .pc{position:relative;font:600 16px/1 Oswald,sans-serif;color:var(--c2)}
.vopt.me{border-color:var(--c)}

/* messages */
.wall{display:grid;gap:8px;margin-top:14px}
.msg{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 13px}
.msg .who{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mute);font-weight:700}
.msg .who i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:9px;font-weight:800;color:#06141b}
.msg p{font-size:13.5px;line-height:1.5;margin-top:7px}
.msg.new{border-color:#1f5a3a}
.msg.new .who:after{content:"just now";margin-left:auto;color:var(--green);font-size:10px;letter-spacing:1px;text-transform:uppercase}
.msg.f{border-color:#1b5b70;background:#0c1a22}

/* sponsors */
.spons{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.sp{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 13px;display:flex;align-items:center;gap:10px}
.sp i{width:30px;height:30px;border-radius:8px;background:#15323f;display:grid;place-items:center;font-style:normal;font:700 12px/1 Oswald,sans-serif;color:var(--c2)}
.sp b{display:block;font-size:13px}
.sp small{display:block;font-size:10px;color:var(--mute);letter-spacing:1px;text-transform:uppercase;margin-top:2px;font-weight:800}
.sp.add{border-style:dashed;color:var(--c2);font-weight:700;font-size:12px;cursor:pointer;background:none}
.ring{margin-top:12px;display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.ring .r{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.ring .r b{display:block;font:600 15px/1 Oswald,sans-serif;text-transform:uppercase}
.ring .r small{display:block;font-size:11px;color:var(--mute);margin-top:3px}
.ring .r .p{font:600 18px/1 Oswald,sans-serif;color:var(--c2);margin-top:6px}
.ring .r.gone{opacity:.45}

/* share */
.share{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:0;border-radius:12px;padding:14px 12px;font:700 14px/1 Oswald,sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink);background:#0e2430;border:1px solid var(--line)}
.btn.p{background:linear-gradient(180deg,var(--c2),var(--c));color:#04141b;border-color:transparent}
.btn.g{background:#0f2a1c;color:var(--green);border-color:#1f5a3a}
.btn.r{background:#2a0f14;color:var(--red);border-color:#6b2430}
.btn:disabled{opacity:.5;cursor:default}
.mylink{margin-top:12px;background:#07141b;border:1px dashed #1b5b70;border-radius:12px;padding:11px 12px;font-size:12px;line-height:1.5}
.mylink code{display:block;color:var(--c2);font-weight:800;margin-top:4px;word-break:break-all}

/* HQ + staff */
.hq{background:linear-gradient(180deg,#0c1d26,#0b1319);border:1px solid #1b5b70;border-radius:18px;padding:16px;margin-top:14px;box-shadow:0 0 0 4px rgba(31,182,230,.06)}
.hq .hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hq .hd h3{font:600 20px/1 Oswald,sans-serif;text-transform:uppercase}
.hq .hd .lock{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--c2);font-weight:800;border:1px solid #1b5b70;border-radius:99px;padding:5px 9px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.tile{background:#07141b;border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.tile b{display:block;font:600 22px/1 Oswald,sans-serif;font-variant-numeric:tabular-nums}
.tile small{display:block;font-size:9px;letter-spacing:1.3px;text-transform:uppercase;color:var(--mute);margin-top:4px;font-weight:800}
.tile.alert b{color:var(--amber)}.tile.good b{color:var(--green)}
.list{margin-top:12px;display:grid;gap:6px}
.li{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;background:#07141b;border:1px solid var(--line);border-radius:10px;padding:9px 11px;gap:8px}
.li small{color:var(--mute);font-size:11px;display:block}
.li .pill{font-size:9.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:4px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.li .pill.ok{color:var(--green);border-color:#1f5a3a}.li .pill.hold{color:var(--amber);border-color:#5a4a1f}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.hq textarea,.hq input{width:100%;background:#07141b;border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:10px;font-family:inherit;font-size:12.5px;line-height:1.5;margin-top:8px}
.hq textarea{resize:vertical;min-height:70px}
.hint{font-size:11px;color:var(--mute);margin-top:8px;line-height:1.5}
.hint em{font-style:normal;color:var(--ink)}
table.data{width:100%;border-collapse:collapse;margin-top:10px;font-size:11.5px}
table.data th{font-size:9.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--mute);text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);font-weight:800}
table.data td{padding:7px 6px;border-bottom:1px solid #0f1e26;vertical-align:top;font-variant-numeric:tabular-nums}
table.data td.src{color:var(--c2);font-weight:700;white-space:nowrap}
.tscroll{overflow-x:auto;margin-top:4px}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(6,8,10,.9);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.dock .in{max-width:1040px;margin:0 auto;display:flex;gap:8px;align-items:center}
.dock .cnt{font-size:11px;color:var(--mute);line-height:1.4;flex:1;min-width:0}
.dock .cnt b{color:var(--ink);display:block;font-size:12.5px}
.dock .btn{padding:12px 16px;white-space:nowrap}
@media(min-width:900px){.dock{display:none}}
body.nodock .dock{display:none}

/* sheets */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;justify-content:center;z-index:50;padding:10px}
.ov.on{display:flex}
.sheet{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:#0b1319;border:1px solid #1b5b70;border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.sheet h3{font:600 22px/1.05 Oswald,sans-serif;text-transform:uppercase}
.sheet .sub{font-size:12.5px;color:var(--mute);margin-top:5px;line-height:1.5}
label{display:block;font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:#cfdbe0;margin:13px 0 6px}
label .o{color:var(--mute);font-weight:600;letter-spacing:0;text-transform:none}
input,select,textarea{width:100%;background:#07141b;border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:12px;font-family:inherit;font-size:15px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--c)}
textarea{min-height:76px;resize:vertical;font-size:14px}
.opts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.opt{background:#07141b;border:1px solid var(--line);border-radius:10px;padding:10px 8px;text-align:center;color:var(--ink)}
.opt b{display:block;font:600 14px/1 Oswald,sans-serif;text-transform:uppercase}
.opt small{display:block;font-size:10px;color:var(--mute);margin-top:4px;line-height:1.3}
.opt.on{border-color:var(--c);background:#0d2430}
.opt .price{color:var(--c2);font-weight:800;font-size:11px;margin-top:4px}
.opt .price s{color:var(--mute);font-weight:600;margin-right:4px}
.qty{display:flex;align-items:center;gap:10px;margin-top:8px}
.qty button{width:40px;height:40px;border-radius:10px;background:#0e2430;border:1px solid var(--line);color:var(--ink);font-size:18px;font-weight:800}
.qty b{font:600 22px/1 Oswald,sans-serif;min-width:30px;text-align:center}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#07141b;border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-top:13px}
.tog .l b{display:block;font-size:13px}.tog .l small{display:block;font-size:11px;color:var(--mute);margin-top:2px}
.sw{width:44px;height:26px;border-radius:99px;background:#15323f;border:0;position:relative;flex:none}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#8fa4ae;transition:.15s}
.sw.on{background:var(--c)}.sw.on:after{left:21px;background:#04141b}
.sizes{display:flex;gap:6px;margin-top:8px}
.sizes button{flex:1;background:#07141b;border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:8px 0;font-weight:800;font-size:12px}
.sizes button.on{border-color:var(--c);background:#0d2430}
.total{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding:12px;background:#07141b;border:1px solid var(--line);border-radius:12px}
.total b{font:600 24px/1 Oswald,sans-serif}.total small{display:block;font-size:11px;color:var(--mute);margin-top:3px}
.consent{display:flex;gap:9px;align-items:flex-start;font-size:11px;color:var(--mute);line-height:1.5;margin-top:12px}
.consent input{width:18px;height:18px;margin-top:1px;flex:none}
.fine{font-size:11px;color:var(--mute);line-height:1.5;margin-top:12px}
.err{color:var(--red);font-size:12px;margin-top:8px;min-height:16px}
.sheet .btn{width:100%;margin-top:14px}
.cancel{background:none;border:0;color:var(--mute);font-family:inherit;font-weight:800;font-size:12px;margin-top:10px;width:100%}
.done{text-align:center;padding:6px 0}
.done .tick{width:62px;height:62px;border-radius:50%;background:#0f2a1c;border:1px solid #1f5a3a;display:grid;place-items:center;margin:0 auto 12px}
.done .tick svg{width:30px;height:30px;stroke:var(--green);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.done h3{font-size:26px}
.done p{font-size:13px;color:var(--mute);margin-top:8px;line-height:1.55}
.done p b{color:var(--ink)}
.card{margin-top:14px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#07141b;max-width:300px;margin-left:auto;margin-right:auto}
.card img{width:100%;aspect-ratio:4/5;object-fit:contain;display:block}
.card .ct{padding:12px 14px 14px;background:#07141b;border-top:1px solid var(--line);text-align:left}
.card .ct b{display:block;font:600 17px/1.1 Oswald,sans-serif;text-transform:uppercase}
.card .ct small{display:block;font-size:10.5px;color:#cfdbe0;margin-top:5px;line-height:1.45}
.card .ct em{font-style:normal;color:var(--c2);font-weight:800}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#0f2a1c;color:var(--green);border:1px solid #1f5a3a;border-radius:99px;padding:10px 16px;font-size:12.5px;font-weight:700;opacity:0;transition:.2s;z-index:60;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{margin:34px 0 10px;text-align:center;font-size:11px;color:var(--mute);line-height:1.7}
.foot b{color:var(--ink)}
.bout{margin-top:14px;display:grid;gap:8px}
.bo{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px}
.bo .n{font:600 16px/1 Oswald,sans-serif;color:var(--mute);min-width:26px}
.bo b{font-weight:800}
.bo.me{border-color:#1b5b70;background:#0c1a22}
.bo .st{font-size:9.5px;letter-spacing:1px;text-transform:uppercase;font-weight:800;color:var(--mute)}
.bo .st.live{color:var(--red)}.bo .st.done{color:var(--green)}
.rounds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.rd{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.rd small{display:block;font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mute);font-weight:800}
.rd .b{display:flex;gap:6px;margin-top:8px}
.rd .b button{flex:1;background:#07141b;border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:8px 0;font-weight:800;font-size:12px}
.rd .b button.on{border-color:var(--c);background:#0d2430;color:var(--c2)}
.rd .b button:disabled{opacity:.4}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style><style>
.tix2{display:grid;gap:10px;margin-top:14px}
.tk{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;position:relative;overflow:hidden}
.tk.on{border-color:var(--c);background:#0c1a22;box-shadow:0 0 0 3px rgba(31,182,230,.12)}
.tk .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.tk .nm{font:600 22px/1 Oswald,sans-serif;text-transform:uppercase}
.tk .tag{font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;font-weight:800;color:var(--mute);margin-top:5px}
.tk .pr{text-align:right}
.tk .pr b{display:block;font:600 26px/1 Oswald,sans-serif;color:var(--c2);font-variant-numeric:tabular-nums}
.tk .pr small{display:block;font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mute);font-weight:800;margin-top:4px}
.tk ul{list-style:none;margin-top:12px;display:grid;gap:5px}
.tk li{font-size:12.5px;color:#d6e0e4;padding-left:18px;position:relative;line-height:1.45}
.tk li:before{content:"";position:absolute;left:0;top:7px;width:8px;height:8px;border-radius:50%;background:var(--c)}
.tk li.no{color:var(--mute)}.tk li.no:before{background:#2a3a42}
.tk .pick{margin-top:12px;width:100%;border-radius:11px;padding:12px;font:700 13px/1 Oswald,sans-serif;letter-spacing:1.5px;text-transform:uppercase;background:#0e2430;border:1px solid var(--line);color:var(--ink)}
.tk .pick{background:linear-gradient(180deg,var(--c2),var(--c));color:#04141b;border-color:transparent}
.block{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.block .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.block .hd b{font:600 18px/1 Oswald,sans-serif;text-transform:uppercase}
.block .hd small{font-size:11px;color:var(--mute);font-weight:700}
.grid10{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:11px}
.grid10 i{aspect-ratio:1;border-radius:7px;background:#15323f;display:grid;place-items:center;font-style:normal;font-size:9px;font-weight:800;color:#06141b}
.grid10 i.on{background:var(--c)}.grid10 i.me{background:var(--green)}.grid10 i.q{background:#0e2430;border:1px dashed #2a5566}
.block p{font-size:12px;color:var(--mute);margin-top:9px;line-height:1.5}
.block p b{color:var(--ink)}
.full{margin-top:14px;background:linear-gradient(180deg,#0f2a1c,#0b1319);border:1px solid #1f5a3a;border-radius:16px;padding:16px}
.full h3{font:600 22px/1 Oswald,sans-serif;text-transform:uppercase;color:var(--green)}
.full p{font-size:12.5px;color:#d6e0e4;margin-top:6px;line-height:1.5}
.req{margin-top:14px;background:#2a2211;border:1px solid #6b5520;border-radius:14px;padding:12px 14px;font-size:12.5px;line-height:1.5}
.req b{color:var(--amber)}
</style>
</head>

function tk(o){
  var T=TIERS[o];var left=venueLeft(o);var tablesLeft=o==="ga"?left:Math.ceil(left/T.seats);
  return '<div class="tk"><div class="hd"><div><div class="nm">'+T.nm+'</div><div class="tag">'+T.tag+'</div></div><div class="pr"><b>'+T.price+'</b><small>'+T.unit+' · to be confirmed</small></div></div><ul>'+T.pts.map(function(x){return '<li>'+x+'</li>';}).join("")+T.no.map(function(x){return '<li class="no">'+x+'</li>';}).join("")+'</ul>'+
    '<div class="tag" style="margin-top:10px;color:var(--c2)">'+(o==="ga"?tablesLeft+' of '+T.cap+' tickets left':tablesLeft+' of '+T.cap+' tables left')+' across the venue</div>'+
    '<button class="pick" onclick="pickOpt(\''+o+'\')">Hold a '+(o==="ga"?"GA ticket":T.nm.toLowerCase()+" seat")+'</button></div>';
}
window.pickOpt=function(o){S.opt=o;if(full()&&S.request!=="approved"){openList();return;}openHold();};
window.primary=function(){if(full()&&S.request!=="approved"){openList();return;}openHold();};

function person(){return '<label>Full name</label><input id="fN" placeholder="First and last"><label>Mobile</label><input id="fM" inputmode="tel" placeholder="04…"><label>Email</label><input id="fE" inputmode="email" placeholder="you@…">';}
function readPerson(){var n=$("fN").value.trim().replace(/\s+/g," "),m=$("fM").value.trim(),e=$("fE").value.trim(),err=$("fErr");
  if(n.length<3||n.indexOf(" ")<0){err.textContent="Full name please, first and last.";return null;}
  if(!/^0?4\d{8}$|^\+?61\s?4\d{8}$/.test(m.replace(/\s/g,""))){err.textContent="That mobile doesn\'t look right.";return null;}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)){err.textContent="Check the email.";return null;}
  err.textContent="";return {name:n,first:n.split(" ")[0],short:n.split(" ")[0]+" "+n.split(" ")[1][0],mobile:m,email:e};}
window.openHold=function(){
  var o=S.opt;
  open('<h3>Hold me a ticket</h3><div class="sub"><b style="color:var(--ink)">'+TIERS[o].nm+' · '+TIERS[o].price+' '+TIERS[o].unit+'.</b> '+TIERS[o].tag+'. Price to be confirmed within 2 weeks, pending supplier pricing. Holding doesn\'t commit you to buying — it puts you on the early release at the pre-sale discount. One hold per person.</div>'+person()+
    '<label>A few words for Braiden <span class="o">(optional — he reads these fight week)</span></label><textarea id="rMsg" placeholder="Go on, say something."></textarea>'+
    '<div class="consent"><input type="checkbox" id="fC" checked><span>Legacy Gym can text and email me about Fight Night. No spam, unsubscribe any time.</span></div><div class="err" id="fErr"></div><button class="btn p" onclick="submitHold()">Hold my ticket</button><div class="fine">Under 18? Hold your own and we\'ll be in touch about nominating them.</div><button class="cancel" onclick="closeAll()">Not now</button>');
};

    gridHtml()+
    (S.request==="pending"?'<div class="req"><b>Request sent.</b> Jake or Ali will approve another ten — usually same day. Your block opens the moment they do.</div>':S.request==="approved"?'<div class="req" style="background:#0f2a1c;border-color:#1f5a3a"><b style="color:var(--green)">Approved.</b> Another ten are open. Tell your people.</div>':full()?'<div class="full"><h3>You\'ve filled your ten</h3><p>That\'s the block done. Want another ten? Jake and Ali approve it, and they open on your page straight away.</p><button class="btn p" style="margin-top:12px;width:100%" onclick="askMore()">I need more tickets</button></div>':'<div class="full" style="background:var(--panel);border-color:var(--line)"><h3 style="color:var(--ink)">'+left()+' left in your block</h3><p>Fill your ten and this button goes live — Jake and Ali approve another ten.</p><button class="btn" style="margin-top:12px;width:100%" disabled>I need more tickets · '+left()+' to go</button></div>')+
    '</div>';
}
window.askMore=function(){S.request="pending";S.log.unshift({t:"Request",w:"Braiden",d:"+10 tickets"});render();toast("Sent to Jake and Ali");};
function figMain(){
  return '<div class="sec"><h2>Who\'s holding</h2><div class="sub">Everyone who\'s held a ticket to your name. Chase the ones who haven\'t paid when tickets release.</div><div class="list">'+S.held.map(function(h){return '<div class="li"><div>'+esc(h.n)+'<small>'+TIERS[h.o].nm+'</small></div><span class="pill hold">Held</span></div>';}).join("")+'</div></div>'+
    '<div class="sec"><h2>Share your page</h2><div class="share"><button class="btn p" onclick="toast(\'Copied — your link and a line to post\')">Copy share text</button><button class="btn" onclick="toast(\'Downloads your card\')">My card</button></div><div class="hint"><em>Share text:</em> "I\'m fighting at Legacy on Dec 19. I\'ve got '+(full()?"a few more":left())+' tickets held for the people who back me — grab one here, nothing to pay yet: legacygym.net/fightnight/braiden-griggs"</div></div>';
}

/* ---------- staff ---------- */
function staffHtml(){
  return '<div class="hq"><div class="hd"><h3>Braiden Griggs</h3><span class="lock">Jake &amp; Ali only</span></div>'+
    '<div class="tiles"><div class="tile"><b>'+S.held.length+'<span style="font-size:13px;color:var(--mute)">/'+S.block+'</span></b><small>Held</small></div><div class="tile"><b>'+S.block+'</b><small>Block size</small></div><div class="tile'+(S.request==="pending"?" alert":"")+'"><b>'+(S.request==="pending"?"1":"0")+'</b><small>Requests</small></div><div class="tile"><b>'+S.log.filter(function(l){return l.t==="Waitlist";}).length+'</b><small>Waiting</small></div></div>'+gridHtml()+
    (S.request==="pending"?'<div class="req"><b>Braiden has filled his 10 and asked for more.</b><div class="share" style="margin-top:10px"><button class="btn g" onclick="approve()">Approve +10</button><button class="btn" onclick="decline()">Not yet</button></div></div>':'<div class="hint" style="margin-top:12px"><em>No open requests.</em> You can also top him up without being asked.<div class="share" style="margin-top:8px"><button class="btn" onclick="approve()">Open +10 now</button><button class="btn" onclick="toast(\'Opens Braiden in the Fight Night Tickets tab\')">Open in the tab</button></div></div>')+'</div>';
}
window.approve=function(){S.block+=10;S.request="approved";S.log.unshift({t:"Approved",w:"Jake",d:"Block → "+S.block});render();toast("Another ten open on Braiden\'s page");};
window.decline=function(){S.request=null;S.log.unshift({t:"Declined",w:"Jake",d:"Hold for now"});render();toast("Braiden\'s been told");};
function staMain(){
  var mine={gold:0,silver:0,ga:0};S.held.forEach(function(h){mine[h.o]++;});
  var P={gold:199,silver:155,ga:79};
  var rows=[["Braiden Griggs",S.block,mine.gold,mine.silver,mine.ga],["Mick Egan",20,8,5,6],["Erin Sheehy",10,2,3,5],["Alivia Steane",10,5,2,2],["Koby Beecham",10,1,2,4],["Terry Matthews",10,4,2,3]];
  var tot={gold:0,silver:0,ga:0},B=0;rows.forEach(function(r){tot.gold+=r[2];tot.silver+=r[3];tot.ga+=r[4];B+=r[1];});
  var val=function(g,s,a){return g*P.gold+s*P.silver+a*P.ga;};
  var venue='<div class="sec"><h2>Venue — all tickets</h2><div class="sub">Capacity across the whole night, every fighter combined. Holds count against it as they come in.</div><div class="tscroll"><table class="data"><tr><th>Tier</th><th>Where</th><th>Max</th><th>Held</th><th>Left</th></tr>'+
    [["gold","Rows 1–3 · ring side"],["silver","Rows 4–5 · opposite side"],["ga","Front of house · standing"]].map(function(x){var T=TIERS[x[0]];var total=T.cap*T.seats;var left=venueLeft(x[0]);var held=total-left;return '<tr><td><b>'+T.nm+'</b></td><td>'+x[1]+'</td><td>'+T.cap+' '+T.capUnit+(x[0]==="ga"?'':' · '+total+' seats')+'</td><td>'+held+'</td><td>'+(x[0]==="ga"?left+' tickets':Math.ceil(left/T.seats)+' tables')+'</td></tr>';}).join("")+'</table></div>'+
    '<div class="hint">Gold 12 tables · Silver 10 tables · GA 130 tickets. Change any cap in the Fight Night Tickets tab and every fighter page updates.</div></div>';
  var summary='<div class="sec"><h2>Sales — all fighters</h2><div class="sub">Holds by tier and estimated value at the bottom of each range. Only you and Ali see money.</div>'+
    '<div class="tiles"><div class="tile good"><b>$'+val(tot.gold,tot.silver,tot.ga).toLocaleString()+'</b><small>Est. value</small></div><div class="tile"><b>'+tot.gold+'</b><small>Gold</small></div><div class="tile"><b>'+tot.silver+'</b><small>Silver</small></div><div class="tile"><b>'+tot.ga+'</b><small>GA</small></div></div>'+
    '<div class="tscroll"><table class="data"><tr><th>Fighter</th><th>Block</th><th>Gold</th><th>Silver</th><th>GA</th><th>Held</th><th>Est. $</th></tr>'+rows.map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td><td>'+r[4]+'</td><td>'+(r[2]+r[3]+r[4])+'/'+r[1]+'</td><td>$'+val(r[2],r[3],r[4]).toLocaleString()+'</td></tr>';}).join("")+'<tr><td><b>Total</b></td><td>'+B+'</td><td><b>'+tot.gold+'</b></td><td><b>'+tot.silver+'</b></td><td><b>'+tot.ga+'</b></td><td><b>'+(tot.gold+tot.silver+tot.ga)+'</b></td><td><b>$'+val(tot.gold,tot.silver,tot.ga).toLocaleString()+'</b></td></tr></table></div>'+
    '<div class="hint">Valued at $199 / $155 / $79 until confirmed. Six fighters shown — the live tab lists all 37, sortable, with CSV export.</div></div>';
  summary=venue+summary;
  return summary+'<div class="sec"><h2>Activity</h2><div class="sub">Everything that happens on his page, newest first. The same feed sits in the Fight Night Tickets tab for all 37 fighters.</div><div class="list">'+(S.log.length?S.log.map(function(l){return '<div class="li"><div>'+esc(l.t)+' — '+esc(l.w)+'<small>'+esc(l.d)+'</small></div><span class="pill">'+esc(l.t)+'</span></div>';}).join(""):'<div class="li"><div class="mute">Nothing yet — hold a ticket as a supporter to see it land here.</div></div>')+'</div></div>'+
    '<div class="sec"><h2>Pricing (to confirm)</h2><div class="list"><div class="li"><div>Gold table · tier 1<small>Rows 1–3 ring side · food catered · drink package · seats 10–12 · max 12 tables</small></div><b>$199–220</b></div><div class="li"><div>Silver table · tier 2<small>Rows 4–5 opposite side · food · small drink package · seats 10 · max 10 tables</small></div><b>$155–180</b></div><div class="li"><div>General admission · tier 3<small>Front of house standing · bar tables &amp; stools · bar for purchase · max 130</small></div><b>$79–89</b></div></div><div class="hint">All prices to be confirmed within 2 weeks, pending supplier pricing. Every hold stores name, email and mobile. When tickets release, everyone holding gets an email and a text with the link to buy — holding never commits them to purchase.</div>';
}
render();
})();
</script>
