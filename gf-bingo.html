<style>
:root{--bg:#070b14;--panel:#0f1626;--panel2:#141d31;--line:#1f2a40;--fg:#fff;--mute:#9aa4b5;--kni:#0054a4;--kni2:#ee3524;--roo:#e82c2e;--roo2:#0a1e3f;--gold:#f4c95d;--live:#22c55e;--display:Anton,Oswald,sans-serif;--head:Oswald,sans-serif;--body:Montserrat,system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box;margin:0}

function simGame(seed){
  var r=rng(seed*7919+13),ev=[],mins=[];
  var nTries=5+Math.floor(r()*4);for(var i=0;i<nTries;i++)mins.push(2+Math.floor(r()*77));mins.sort(function(a,b){return a-b;});

  var kick={k:'Sandon Smith',r:'Sam Walker'};
  mins.forEach(function(m){var t=r()<.5?K:R;ev.push({type:'try',min:m,t:t,player:scorer(t)});if(r()<.78)ev.push({type:'conversion',min:Math.min(80,m+1),t:t,player:kick[t]});});
  if(r()<.55){var t2=r()<.5?K:R;ev.push({type:'penalty goal',min:3+Math.floor(r()*75),t:t2,player:kick[t2]});}
  if(r()<.35){var t3=r()<.5?K:R;ev.push({type:'drop goal',min:60+Math.floor(r()*19),t:t3,player:t3===K?(r()<.5?'Sandon Smith':'Kalyn Ponga'):(r()<.5?'Sam Walker':'Daly Cherry-Evans'),two:r()<.2});}
  if(r()<.5){var t4=r()<.5?K:R;var p4=PL.filter(function(p){return p[0]===t4&&p[1]<=13;});ev.push({type:'yellow card',min:5+Math.floor(r()*72),t:t4,player:p4[Math.floor(r()*p4.length)][2]});}
  if(r()<.06){var t5=r()<.5?K:R;var p5=PL.filter(function(p){return p[0]===t5&&p[1]<=13;});ev.push({type:'red card',min:20+Math.floor(r()*50),t:t5,player:p5[Math.floor(r()*p5.length)][2]});}
  ev.sort(function(a,b){return a.min-b.min||(a.type==='try'?-1:1);});
  var out=[],ht=false;ev.forEach(function(e){if(!ht&&e.min>40){out.push({type:'ht',min:40,t:'a'});ht=true;}out.push(e);});if(!ht)out.push({type:'ht',min:40,t:'a'});out.push({type:'ft',min:80,t:'a'});
  out.forEach(function(x,i){x.seq=i;x.key=x.type+'|'+x.min+'|'+(x.player||x.t);});return out;
}

  var s='<div class="rules"><h3>How it plays</h3><p>Everyone gets a <b>5 by 5 card</b> with a free square in the middle. Every card is different, drawn from a pool of <b>'+POOL.length+' things</b> that can happen tonight: who scores, how the goals go, sin bins, send offs and how the game plays out.</p><p><b>It marks itself.</b> The page reads the live match feed every 20 seconds. When someone scores, their face comes up on every screen and every card with their name on it ticks over on its own.</p><p><b>Three prizes.</b> First card to complete any line of five (across, down or diagonal). Most squares at half time. Most squares at the full-time siren. Ties go to the lower card number, so grab your card early.</p><h3>The pool</h3>';
  Object.keys(cats).forEach(function(c){s+='<p><b>'+esc(c)+'</b> ('+cats[c].length+')</p><div class="pool">'+cats[c].map(function(n){return '<span>'+esc(n)+'</span>';}).join('')+'</div>';});
  s+='</div>';return s;}
var lastKey='';
function R_(){
  document.getElementById('feed').innerHTML=feedHtml();document.getElementById('src').innerHTML=srcHtml();
  document.getElementById('wrap').classList.toggle('wide',S.view==='screen');
  ['card','ft','screen'].forEach(function(v){document.getElementById('v-'+v).hidden=S.view!==v;});
  document.querySelectorAll('.tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.v===S.view);});
  /* only rebuild the views when something they show has changed, so the photos are not reloaded every tick */
  var key=S.view+'|'+S.picks.length+'|'+(S.myPick||'')+'|'+S.picks.map(function(x){return x.card_no+x.player;}).join(',')+'|'+S.mode+'|'+S.events.map(function(e){return e.key;}).join(',')+'|'+S.st.state+S.st.period+'|'+(S.me?S.me.card_no:'')+'|'+S.cards.length+'|'+S.joinErr+'|'+(S.prefill||'')+'|'+(S.st.gameMin>43?1:0);
  if(key===lastKey)return;lastKey=key;
  if(S.view==='card'){var active=document.activeElement;if(!(active&&active.id==='jn'))document.getElementById('v-card').innerHTML=cardHtml();}
  if(S.view==='ft')document.getElementById('v-ft').innerHTML=ftHtml();
  if(S.view==='screen')document.getElementById('v-screen').innerHTML=screenHtml();
  
}
function join(){var nm=(document.getElementById('jn')||{}).value||'';nm=nm.trim().replace(/\s+/g,' ');if(nm.length<2){S.joinErr='Pop your name in first.';R_();return;}
  if(!sb){S.joinErr='Not connected. Try again in a sec.';R_();return;}
  S.joinErr='';var have=S.uid&&S.cards.find(function(c){return c.user_id===S.uid;});if(!have)have=S.cards.find(function(c){return c.device_key===devKey;});if(have){S.me=have;R_();return;}
  var row={event_key:EVENT,name:nm,device_key:devKey};if(S.uid)row.user_id=S.uid;
  sb.from('gf_bingo_cards').insert(row).select('card_no,name,device_key').single().then(function(r){if(r.error){if(/duplicate|unique/i.test(r.error.message)){loadCards();return;}S.joinErr='Couldn’t save, try again.';R_();return;}S.me=r.data;S.cards.push(r.data);R_();loadPicks();});}
document.addEventListener('click',function(ev){var b=ev.target.closest('button');if(!b)return;
  if(b.dataset.v){S.view=b.dataset.v;R_();try{window.scrollTo(0,0);}catch(e){}return;}
  if(b.dataset.mode){if(b.dataset.mode!==S.mode)setMode(b.dataset.mode);return;}
  if(b.dataset.act==='pp'){S.playing=!S.playing;R_();return;}
  if(b.dataset.act==='new'){S.simSeed++;S.playing=true;lastHits={};setMode('sim');return;}
  if(b.dataset.act==='snd'){S.sound=!S.sound;if(S.sound)ding('conversion');R_();return;}
  if(b.dataset.act==='join'){join();return;}
  if(b.dataset.pick){pick(b.dataset.pick);return;}
  if(b.dataset.act==='mox'){clearTimeout(moTimer);nextMoment();return;}
});
document.addEventListener('keydown',function(ev){if(ev.key==='Enter'&&ev.target&&ev.target.id==='jn')join();});
/* prefill the name for logged-in members */
if(sb){sb.auth.getSession().then(function(r){var u=r&&r.data&&r.data.session&&r.data.session.user;if(!u)return;S.uid=u.id;loadCards();return sb.from('profiles').select('first_name,last_name').eq('id',u.id).maybeSingle().then(function(p){if(p&&p.data){S.prefill=((p.data.first_name||'')+' '+(p.data.last_name||'')).trim();if(!S.me)R_();}});}).catch(function(){});}
Object.keys(HS).forEach(function(n){[240,600].forEach(function(w){var im=new Image();im.src=face(n,w);});});
loadCards();cardsTimer=setInterval(loadCards,20000);
setMode('live');
document.addEventListener('visibilitychange',function(){if(!document.hidden&&S.mode==='live')pollLive();});
setInterval(function(){if(S.mode==='live')R_();},20000);
})();
</script>
