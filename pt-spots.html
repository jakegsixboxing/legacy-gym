<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Train with Jake · PT spots · Legacy Gym</title>
<meta name="description" content="1-on-1 personal training with Jake at Legacy Gym Kincumber. 50 minutes, $90. See the spots left and book yours.">
<meta property="og:title" content="Train with Jake · PT spots open">
<meta property="og:description" content="1-on-1 boxing PT with Jake at Legacy Gym Kincumber. 50 minutes, $90. See what's left and grab a spot.">
<meta property="og:image" content="https://legacygym-app.vercel.app/jake-card.jpg">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0b0a08">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0a08;--panel:#16130d;--panel2:#1d1911;--line:#2c2617;--line2:#3a3320;--gold:#d4af37;--gold2:#f1d582;--gold-dim:#9a7f2e;--txt:#f4efe4;--dim:#a89f8d;--dim2:#7d7563;--ok:#5fbf8a;--bad:#e0655b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,'Segoe UI',Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:radial-gradient(900px 420px at 50% -120px,rgba(212,175,55,.18),transparent 70%),var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--gold2);text-align:center}
.hero{display:flex;align-items:center;gap:16px;margin:18px 0 6px}
.hero img{width:92px;height:92px;border-radius:50%;object-fit:cover;object-position:50% 20%;border:2px solid var(--gold);flex:none;background:var(--panel)}
h1{font-family:Anton,Impact,'Arial Narrow',sans-serif;font-weight:400;font-size:clamp(40px,12vw,58px);line-height:.92;margin:0;letter-spacing:.5px;text-transform:uppercase}
h1 span{color:var(--gold2);display:block}
.day{font-family:Oswald,sans-serif;font-weight:600;font-size:20px;letter-spacing:1px;text-transform:uppercase;margin:16px 0 4px}
.sub{color:var(--dim);font-size:14.5px;line-height:1.5;margin:0 0 16px}
.sub b{color:var(--txt)}
.left{display:inline-block;font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:#17120a;background:linear-gradient(180deg,var(--gold2),var(--gold));border-radius:99px;padding:5px 11px;margin-bottom:14px}
.slot{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:16px;margin-bottom:10px;transition:.15s}
.slot .t{font-family:Oswald,sans-serif;font-weight:700;font-size:25px;line-height:1.05;letter-spacing:.3px}
.slot .t small{display:block;font-family:Inter,sans-serif;font-size:12.5px;font-weight:500;color:var(--dim);letter-spacing:0;margin-top:5px}
.slot .r{margin-left:auto;text-align:right;flex:none}
.btn{appearance:none;border:0;cursor:pointer;font-family:Oswald,sans-serif;font-weight:600;font-size:16px;letter-spacing:1.4px;text-transform:uppercase;color:#17120a;background:linear-gradient(180deg,var(--gold2),var(--gold));border-radius:12px;padding:13px 20px;min-height:48px;min-width:112px}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.55;cursor:default}
.btn.full{width:100%;font-size:18px;padding:16px}
.slot.off{opacity:.62;background:#110f0a;border-style:dashed}
.slot.off .t{color:var(--dim)}
.slot.off .t .tm{text-decoration:line-through;text-decoration-thickness:2px}
.tag{display:inline-block;font-family:Oswald,sans-serif;font-weight:700;font-size:17px;letter-spacing:2.4px;text-transform:uppercase;border:2px solid var(--bad);color:var(--bad);border-radius:8px;padding:6px 12px;transform:rotate(-4deg)}
.tag.held{border-color:var(--gold-dim);color:var(--gold2)}
.note{color:var(--dim2);font-size:12.5px;line-height:1.55;margin-top:16px;text-align:center}
.foot{margin-top:28px;text-align:center;color:var(--dim2);font-size:11px;letter-spacing:2.4px;text-transform:uppercase}
.empty{border:1px dashed var(--line2);border-radius:16px;padding:22px;text-align:center;color:var(--dim)}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(5,4,3,.78);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.on{display:flex}
.sheet{width:100%;max-width:560px;background:var(--panel);border:1px solid var(--line2);border-bottom:0;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-right)) calc(22px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));max-height:94vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(26px);opacity:.4}}
.sheet h2{font-family:Oswald,sans-serif;font-weight:700;font-size:24px;letter-spacing:.6px;text-transform:uppercase;margin:0 0 4px}
.sheet .pick{color:var(--gold2);font-weight:600;font-size:14.5px;margin-bottom:12px}
.x{float:right;width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:var(--panel2);color:var(--txt);font-size:17px;cursor:pointer}
label{display:block;font-size:10.5px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--dim);margin:12px 0 5px}
input{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:12px;padding:13px 14px;font:inherit;font-size:16px;color:var(--txt);min-height:50px}
input:focus{outline:2px solid var(--gold);outline-offset:1px}
.terms{font-size:12.5px;color:var(--dim);line-height:1.5;margin:14px 0}
.err{color:var(--bad);font-size:13.5px;font-weight:600;margin:10px 0 0;min-height:18px}
.done{text-align:center;padding:10px 0 4px}
.tick{width:72px;height:72px;border-radius:50%;margin:6px auto 14px;display:grid;place-items:center;font-size:34px;color:#17120a;background:linear-gradient(135deg,var(--gold2),var(--gold-dim))}
.done h2{font-size:28px}
.done p{font-size:15px;line-height:1.6;color:var(--txt);margin:10px 0}
.done p.s{color:var(--dim);font-size:13.5px}
.count{font-family:Oswald,sans-serif;font-size:34px;color:var(--gold2);letter-spacing:1px;margin:8px 0 2px}
@media (min-width:600px){.ov{align-items:center}.sheet{border-radius:20px;border-bottom:1px solid var(--line2)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Legacy Gym · Kincumber</div>
  <div class="hero">
    <img src="/jake-card.jpg" alt="Coach Jake">
    <h1>Train with <span>Jake</span></h1>
  </div>
  <div class="day" id="day">Personal training</div>
  <p class="sub" id="sub">1-on-1 with Jake. <b>50 minutes · $90.</b> Pick a spot below.</p>
  <div id="left"></div>
  <div id="slots"><div class="empty">Loading spots…</div></div>
  <p class="note">Spots are held once payment is made. A secure payment link is sent to you straight after you book.</p>
  <div class="foot">Legacy Gym · Kincumber</div>
</div>

<div class="ov" id="ov" role="dialog" aria-modal="true" aria-labelledby="shT">
  <div class="sheet" id="sheet"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
var SB_URL='https://jyslqxepodrseyhoppce.supabase.co',SB_KEY='sb_publishable_otcHJ5LC4yf-69CAoZghZA_yk_8h_we';
var NOTIFY='https://formsubmit.co/ajax/5ff9676c4c14c5f665182ea590273538';
var PAY={9000:'https://www.legacygym.net/cart/48187483652247:1'};
var sb=null;try{sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false}});}catch(e){}
var SLOTS=[],PICK=null,BUSY=false,MINE=null,TZ='Australia/Sydney';
function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function tm(d){return new Intl.DateTimeFormat('en-AU',{timeZone:TZ,hour:'numeric',minute:'2-digit',hour12:true}).format(d).replace(/\s/g,'').toLowerCase();}
function dayLong(d){return new Intl.DateTimeFormat('en-AU',{timeZone:TZ,weekday:'long',day:'numeric',month:'long'}).format(d);}
function dayKey(d){return new Intl.DateTimeFormat('en-CA',{timeZone:TZ}).format(d);}
function range(s){var a=new Date(s.starts_at),b=new Date(a.getTime()+s.minutes*60000);return tm(a)+' to '+tm(b);}
function money(c){return '$'+(c/100).toFixed(2).replace(/\.00$/,'');}
function render(){
  var box=$('#slots');
  if(!SLOTS.length){box.innerHTML='<div class="empty">No PT spots are open right now. Check back soon.</div>';$('#left').innerHTML='';return;}
  var first=new Date(SLOTS[0].starts_at),k=dayKey(first),today=dayKey(new Date());
  var list=SLOTS.filter(function(s){return dayKey(new Date(s.starts_at))===k;});
  var tomorrow=dayKey(new Date(Date.now()+864e5));
  $('#day').textContent=(k===today?'Today · ':k===tomorrow?'Tomorrow · ':'')+dayLong(first);
  var p=list[0];
  $('#sub').innerHTML='1-on-1 with Jake. <b>'+p.minutes+' minutes · '+money(p.price_cents)+'.</b> Pick a spot below.';
  var open=list.filter(function(s){return s.status==='open';}).length;
  $('#left').innerHTML=open?'<span class="left">'+open+' spot'+(open===1?'':'s')+' left</span>':'<span class="left">All spots taken</span>';
  box.innerHTML=list.map(function(s){
    var off=s.status!=='open',lab=s.status==='held'?(MINE===s.id?'Held for you':'On hold'):s.status==='sold'?'Sold':'Closed';
    return '<div class="slot'+(off?' off':'')+'"><div class="t"><span class="tm">'+esc(range(s))+'</span><small>'+s.minutes+' minutes · 1-on-1 · '+money(s.price_cents)+'</small></div><div class="r">'
      +(off?'<span class="tag'+(s.status==='held'?' held':'')+'">'+lab+'</span>':'<button class="btn" data-id="'+esc(s.id)+'">Book</button>')+'</div></div>';
  }).join('');
}
function load(){
  if(!sb){$('#slots').innerHTML='<div class="empty">Could not load the spots. Please refresh the page.</div>';return Promise.resolve();}
  return sb.rpc('pt_spots_public').then(function(r){if(r.error)throw r.error;SLOTS=r.data||[];render();}).catch(function(){if(!SLOTS.length)$('#slots').innerHTML='<div class="empty">Could not load the spots. Please refresh the page.</div>';});
}
function openSheet(id){
  PICK=SLOTS.filter(function(s){return s.id===id;})[0];if(!PICK)return;
  $('#sheet').innerHTML='<button class="x" id="shX" aria-label="Close">✕</button><h2 id="shT">Book this spot</h2>'
   +'<div class="pick">'+esc(dayLong(new Date(PICK.starts_at)))+' · '+esc(range(PICK))+' · '+money(PICK.price_cents)+'</div>'
   +'<form id="f" novalidate><label for="n">Your name</label><input id="n" name="name" autocomplete="name" maxlength="80" required>'
   +'<label for="m">Mobile</label><input id="m" name="mobile" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" required>'
   +'<label for="e">Email</label><input id="e" name="email" type="email" inputmode="email" autocomplete="email" maxlength="120" required>'
   +'<p class="terms">All payments must be made in advance for personal training before spots are held. A secure payment link is sent to you after you book.</p>'
   +'<button class="btn full" id="go">Book my spot</button><div class="err" id="err" role="alert"></div></form>';
  $('#ov').classList.add('on');setTimeout(function(){var n=$('#n');if(n)n.focus();},60);
}
function closeSheet(){$('#ov').classList.remove('on');PICK=null;load();}
function fail(t){var e=$('#err');if(e)e.textContent=t;BUSY=false;var g=$('#go');if(g){g.disabled=false;g.textContent='Book my spot';}}
function notify(d){
  try{var fd=new FormData();
   fd.append('Booking','PT with Jake');fd.append('Session',d.when);fd.append('Price',d.price);
   fd.append('Name',d.name);fd.append('Mobile',d.mobile);fd.append('Email',d.email);fd.append('Booking ref',d.ref);fd.append('Payment link they were given',d.pay||'none');
   fd.append('Next step','They were shown the secure Shopify payment link on screen. The spot is closed off on the page. Check Shopify for the $90 order; reopen the spot if they do not pay.');
   fd.append('_subject','PT BOOKING: '+d.when+' · '+d.name+' · '+d.ref);
   fd.append('_replyto',d.email);fd.append('_template','table');fd.append('_captcha','false');
   fetch(NOTIFY,{method:'POST',headers:{'Accept':'application/json'},body:fd,keepalive:true}).catch(function(){});
  }catch(e){}
}
function submit(ev){
  ev.preventDefault();if(BUSY||!PICK)return;
  var name=$('#n').value.trim(),mobile=$('#m').value.trim(),email=$('#e').value.trim();
  if(name.length<2)return fail('Please enter your name.');
  if(mobile.replace(/\D/g,'').length<8)return fail('Please enter your mobile number.');
  if(!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(email))return fail('Please enter a valid email address.');
  BUSY=true;$('#err').textContent='';$('#go').disabled=true;$('#go').textContent='Booking…';
  var p=PICK;
  sb.rpc('pt_spot_book',{p_id:p.id,p_name:name,p_mobile:mobile,p_email:email,p_ua:navigator.userAgent}).then(function(r){
    if(r.error)throw r.error;var j=r.data||{};
    if(!j.ok){
      if(j.reason==='taken'){BUSY=false;$('#sheet').innerHTML='<button class="x" id="shX" aria-label="Close">✕</button><div class="done"><h2>Just missed it</h2><p>Someone booked that spot a moment ago. Have a look at what is still open.</p><button class="btn full" id="shOk">See what is left</button></div>';load();return;}
      return fail(j.reason==='mobile'?'Please check your mobile number.':j.reason==='email'?'Please check your email address.':'Please check your details.');
    }
    MINE=p.id;BUSY=false;
    var when=dayLong(new Date(p.starts_at))+', '+range(p);
    var ref='PT-'+String(p.id).replace(/-/g,'').slice(0,6).toUpperCase();
    var base=PAY[p.price_cents]||'',pay=base?base+'?note='+encodeURIComponent('PT with Jake '+when+' ref '+ref):'';
    notify({when:when,price:money(p.price_cents),name:name,mobile:mobile,email:email,ref:ref,pay:base});
    $('#sheet').innerHTML='<div class="done"><div class="tick">✓</div><h2 id="shT">Spot held</h2>'
      +'<div class="pick" style="margin:6px 0 0">'+esc(when)+'</div>'
      +(pay?'<p><b>Your secure payment link is ready.</b> Tap below to pay '+money(p.price_cents)+' and lock in your spot.</p>'
        +'<a class="btn full" id="payNow" href="'+esc(pay)+'" target="_blank" rel="noopener" style="display:block;text-decoration:none;text-align:center;margin:12px 0 4px">Pay '+money(p.price_cents)+' now</a>'
        +'<p class="s">Secure Legacy Gym checkout. Card, Apple Pay or Google Pay.</p>'
        :'<p><b>A secure link will now be sent to you for payment.</b></p>')
      +'<p>All payments must be made in advance for personal training before spots are held.</p>'
      +'<p>This spot is now held for you for 10 minutes until payment is processed.</p>'
      +'<div class="count" id="cd">10:00</div><p class="s">Booking reference '+ref+'</p>'
      +'<button class="btn full" id="shOk" style="margin-top:10px;background:none;border:1px solid var(--line2);color:var(--txt)">Close</button></div>';
    var end=Date.now()+600000,iv=setInterval(function(){var c=$('#cd');if(!c){clearInterval(iv);return;}var s=Math.max(0,Math.round((end-Date.now())/1000));c.textContent=Math.floor(s/60)+':'+('0'+s%60).slice(-2);if(!s)clearInterval(iv);},1000);
    load();
  }).catch(function(){fail('Something went wrong. Please try again.');});
}
document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('button[data-id]');if(b){openSheet(b.getAttribute('data-id'));return;}
  if(e.target.id==='shX'||e.target.id==='shOk'||e.target.id==='ov'){closeSheet();}
});
document.addEventListener('submit',function(e){if(e.target.id==='f')submit(e);});
document.addEventListener('input',function(){var e=$('#err');if(e&&e.textContent)e.textContent='';});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('#ov').classList.contains('on'))closeSheet();});
load();setInterval(function(){if(!$('#ov').classList.contains('on'))load();},20000);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&!$('#ov').classList.contains('on'))load();});
})();
</script>
</body>
</html>
