 h+='<div class="sw" role="group" aria-label="Colour">'+COLS.map(function(c){return '<button type="button" data-mc="'+c+'" aria-pressed="'+(M.c===c)+'" aria-label="'+c+'"><img src="'+img(M.t,c)+'" alt=""><span>'+c+'</span></button>';}).join("")+'</div>';
 h+='<div class="madd"><select id="msz" aria-label="Size">'+SIZES.map(function(z){return '<option'+(M.s===z?' selected':'')+'>'+z+'</option>';}).join("")+'</select><button class="addb" type="button" data-act="addm"'+(C.shirts.length>=10?' disabled':'')+'>Add '+E(M.t)+' · '+$m(P.shirt)+'</button></div>';
 if(C.shirts.length)h+='<div class="mlist">'+C.shirts.map(function(s,i){return '<div class="mrow"><img src="'+img(s.t,s.c)+'" alt=""><div><b>'+E(s.c)+' '+E(s.t)+'</b><small>Size '+E(s.s)+' · '+$m(P.shirt)+'</small></div><button class="x" type="button" data-rm="'+i+'" aria-label="Remove '+E(s.c+' '+s.t)+'">×</button></div>';}).join("")+'</div>';
 return h+'</div>';}
function summary(){var C=S.C,L=[];
 OPTS.forEach(function(o){if(C[o.k])L.push([C[o.k]+' × '+o.t,C[o.k]*P[o.k]]);});
 if(C.meals)L.push([C.meals+' × GA food + 1 drink',C.meals*P.meal]);
 C.shirts.forEach(function(s){L.push(['Supporter '+s.t+' · '+s.c+' · '+s.s,P.shirt]);});
 var h=S.fighter?'<div class="l f"><span>Supporting '+E(S.fighter)+'</span><b></b></div>':'';
 if(!L.length)return h+'<div class="l"><span>Nothing in your order yet</span><b>$0</b></div>';
 return h+L.map(function(x){return '<div class="l"><span>'+E(x[0])+'</span><b>'+$m(x[1])+'</b></div>';}).join("")+'<div class="l"><span>Total</span><b>'+$m(total())+'</b></div>';}

function paint(){
 var C=S.C,n=tickets(),h='';
 h+='<div class="top"><img class="logo" src="/img/fc/fc-logo.png" alt="Fight Club"><div><div class="k">Fight Club Central Coast</div><div class="d">Fight Night · Sat 19 Dec 2026 · Legacy Gym, Kincumber</div></div></div>';
 if(TESTKEY)h+='<div class="tb">TEST MODE · this order is marked as a test and doesn\'t count in sales. Refund it in Shopify after.</div>';
 h+='<span class="badge">General sale · open now</span>';
 if(PREV)h+='<a class="prev" href="/t/'+E(PREV.tok)+'"><b>You already have tickets ('+E(PREV.ref)+')</b><span>Supporting '+E(PREV.fighter||'')+'. Tap to see your order or add names ›</span></a>';
 h+='<h1 style="margin-top:12px">Fight Night <span>tickets</span></h1>';
 h+='<p class="lead">Pick the fighter you\'re coming to see, choose your tickets, and pay securely. Your tickets count towards their crew.</p>';
 h+='<h2>Who are you coming to see?</h2>'+pickHtml();
 h+='<h2>Your tickets</h2>'+OPTS.map(optHtml).join("");
 h+='<h2>Extras</h2>';
 h+='<div class="opt'+(C.meals?' on':'')+'"><div><div class="tag">GA only</div><div class="t">GA food + 1 drink</div><div class="s">Food plus one drink. One per GA ticket. Table seats already include food and drinks.</div><div class="p">'+$m(P.meal)+' <small>each</small></div></div>'
  +'<div class="step"><button type="button" data-q="meals" data-d="-1"'+(C.meals?'':' disabled')+' aria-label="One less food pack">−</button><b>'+C.meals+'</b><button type="button" data-q="meals" data-d="1"'+(C.meals<C.ga1?'':' disabled')+' aria-label="One more food pack">+</button></div></div>';
 h+=merchHtml();
 h+='<h2>Your details</h2><div class="you"><div class="row2"><input class="in" id="yf" placeholder="First name" autocomplete="given-name" value="'+E(S.you.first)+'"><input class="in" id="yl" placeholder="Last name" autocomplete="family-name" value="'+E(S.you.last)+'"></div><input class="in" id="ye" type="email" inputmode="email" placeholder="Email (your confirmation goes here)" autocomplete="email" value="'+E(S.you.email)+'"><input class="in" id="ym" type="tel" inputmode="tel" placeholder="Mobile" autocomplete="tel" value="'+E(S.you.mobile)+'"></div>';
 if(n){h+='<h2>Names on tickets</h2><p class="note" style="margin:-2px 0 10px">Optional now. Every ticket needs a name before <b>Wed 9 Dec</b>, when the QR tickets are emailed. You can add or change names on your confirmation link after you pay.</p><div class="names">'
  +Array.from({length:n},function(_,i){return '<input class="in" id="nm'+i+'" data-nm="'+i+'" value="'+E(C.names[i]||"")+'" placeholder="Ticket '+(i+1)+': first and last name (optional)" autocomplete="off">';}).join("")+'</div>';}
 h+='<h2>The agreement</h2><div class="agree">'+E(AGREE)+'<label class="tick"><input type="checkbox" id="agT"'+(S.tick?' checked':'')+'> I have read and agree to these terms.</label><input class="in" id="agN" value="'+E(S.agreeName)+'" placeholder="Type your full name to agree" autocomplete="name"></div>';
 h+='<h2>Your order</h2><div class="sum">'+summary()+'</div>';
 if(C.meals||C.front||C.rows)h+='<div class="food"><b>Food:</b> we\'ll be in contact within 10 days to organise what sort of pizza you\'d like and any dietary requirements.</div>';
 h+='<p class="note">No QR codes at purchase: your QR tickets are emailed on Wed 9 Dec. You pay securely through the Legacy Gym Shopify checkout.</p>';
 h+='<div class="err" id="err">'+E(S.err)+'</div>';
 h+='<div class="foot">Questions? Email fightclub.legacygym@gmail.com<br>Fight Club Central Coast · Legacy Gym Kincumber</div>';
 app.innerHTML=h;bar.hidden=false;paintBar();}
function paintBar(){barIn.innerHTML=(S.fighter?'<div class="who">Supporting <b>'+E(S.fighter)+'</b></div>':'<div class="who">Pick your fighter at the top</div>')+'<button class="pay" type="button" id="payBtn"'+(busy||!tickets()&&!S.C.shirts.length?' disabled':'')+'>'+(busy?'Opening secure checkout…':'Pay '+$m(total())+' securely')+'</button>';}
function refreshList(){var fl=document.getElementById("fl");if(fl)fl.innerHTML=listHtml();var i=document.getElementById("fq");if(i){i.setAttribute("aria-expanded",S.open);var a=document.getElementById("fo"+S.hi);if(S.open&&a)i.setAttribute("aria-activedescendant","fo"+S.hi);else i.removeAttribute("aria-activedescendant");}}
function choose(n){S.fighter=n;S.q="";S.open=false;S.need=false;if(S.err==="Pick the fighter you're coming to see.")S.err="";keep();paint();}
function keep(){var g=function(id){var e=document.getElementById(id);return e?e.value:null;};
 var v;if((v=g("yf"))!==null)S.you.first=v;if((v=g("yl"))!==null)S.you.last=v;if((v=g("ye"))!==null)S.you.email=v;if((v=g("ym"))!==null)S.you.mobile=v;
 if((v=g("agN"))!==null)S.agreeName=v;var t=document.getElementById("agT");if(t)S.tick=t.checked;
 document.querySelectorAll("[data-nm]").forEach(function(el){S.C.names[+el.dataset.nm]=el.value;});}
function fail(msg,focusId){S.err=msg;paint();var f=focusId&&document.getElementById(focusId);var e=document.getElementById("err");
 if(f){f.scrollIntoView({behavior:"smooth",block:"center"});if(f.classList)f.classList.add("bad");}else if(e)e.scrollIntoView({behavior:"smooth",block:"center"});}

app.addEventListener("input",function(ev){var el=ev.target;
 if(el.id==="fq"){S.q=el.value;S.open=true;S.hi=0;refreshList();return;}
 if(el.dataset&&el.dataset.nm!=null)S.C.names[+el.dataset.nm]=el.value;
 if(el.classList.contains("bad")){el.classList.remove("bad");}});
app.addEventListener("focusin",function(ev){if(ev.target.id==="fq"){S.open=true;refreshList();}});
app.addEventListener("focusout",function(ev){if(ev.target.id==="fq")setTimeout(function(){if(document.activeElement&&document.activeElement.id==="fq")return;S.open=false;refreshList();},150);});
app.addEventListener("keydown",function(ev){if(ev.target.id!=="fq")return;var L=matches(S.q).slice(0,7);
 if(ev.key==="ArrowDown"){ev.preventDefault();S.open=true;S.hi=Math.min(L.length-1,S.hi+1);refreshList();}
 else if(ev.key==="ArrowUp"){ev.preventDefault();S.hi=Math.max(0,S.hi-1);refreshList();}
 else if(ev.key==="Enter"){ev.preventDefault();if(S.open&&L[S.hi])choose(L[S.hi]);}
 else if(ev.key==="Escape"){S.open=false;refreshList();}});
app.addEventListener("mousedown",function(ev){var li=ev.target.closest("li[data-f]");if(li){ev.preventDefault();choose(li.dataset.f);}});
app.addEventListener("click",function(ev){var b=ev.target.closest("button");if(!b)return;keep();
 if(b.dataset.act==="change"){S.fighter=null;S.open=true;paint();var i=document.getElementById("fq");if(i)i.focus();return;}
 if(b.dataset.q){var k=b.dataset.q,d=+b.dataset.d,C=S.C;C[k]=Math.max(0,C[k]+d);if(k!=="meals"&&C.meals>C.ga1)C.meals=C.ga1;if(tickets()>40){C[k]-=d;S.err="Up to 40 tickets per order.";}else S.err="";paint();return;}
 if(b.dataset.mt){S.M.t=b.dataset.mt;paint();return;}
 if(b.dataset.mc){S.M.c=b.dataset.mc;paint();return;}
 if(b.dataset.act==="addm"){var z=document.getElementById("msz");if(z)S.M.s=z.value;S.C.shirts.push({c:S.M.c,s:S.M.s,t:S.M.t});paint();return;}
 if(b.dataset.rm!=null){S.C.shirts.splice(+b.dataset.rm,1);paint();return;}});
app.addEventListener("change",function(ev){var el=ev.target;if(el.id==="msz")S.M.s=el.value;});
app.addEventListener("touchstart",function(ev){var li=ev.target.closest&&ev.target.closest("li[data-f]");if(li){ev.preventDefault();choose(li.dataset.f);}},{passive:false});

barIn.addEventListener("click",function(ev){if(!ev.target.closest("#payBtn"))return;keep();
 if(!S.fighter){S.need=true;S.err="Pick the fighter you're coming to see.";paint();var p=document.querySelector(".pick");if(p)p.scrollIntoView({behavior:"smooth",block:"center"});return;}
 if(!S.you.first.trim()||!S.you.last.trim())return fail("Add your first and last name.",!S.you.first.trim()?"yf":"yl");
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(S.you.email.trim()))return fail("Add a real email address. Your confirmation goes there.","ye");
 if(S.you.mobile.replace(/\D/g,"").length<8)return fail("Add your mobile number.","ym");
 if(!S.tick)return fail("Tick the box to accept the agreement.","agT");
 var an=S.agreeName.trim().replace(/\s+/g," ");if(an.length<3||an.indexOf(" ")<0)return fail("Type your full name (first and last) under the agreement.","agN");
 S.err="";goPay();});

async function goPay(){if(busy)return;busy=true;paintBar();
 try{var C=S.C,an=S.agreeName.trim().replace(/\s+/g," ");
  var p=await rpc("fn_pub_prepare",{p_token:lsG(TOKK)||null,p_fighter:FID[S.fighter],p_first:S.you.first.trim(),p_last:S.you.last.trim(),p_email:S.you.email.trim(),p_mobile:S.you.mobile.trim(),
   p_cart:{front:C.front,rows:C.rows,ga1:C.ga1,ga2:0,meals:C.meals,shirts:C.shirts},p_names:C.names.slice(0,tickets()),p_agree_name:an,p_agree_tick:true,p_test:TESTKEY||null});
  if(!p||!p.ok)throw new Error("Couldn't save your order. Try again.");
  lsS(TOKK,p.token);
  var r=await fetch(API,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({token:p.token,ref:p.ref})});var j=await r.json().catch(function(){return null;});
  if(!r.ok||!j||!j.url)throw new Error("Couldn't open the checkout. Try again in a moment.");
  location.href=j.url;
 }catch(x){busy=false;S.err=x.message||String(x);paint();var e=document.getElementById("err");if(e)e.scrollIntoView({behavior:"smooth",block:"center"});}}
async function boot(){
 var i;try{i=await rpc("fn_pub_info",{});}catch(e){app.innerHTML='<h1>Couldn\'t load</h1><p class="lead">Check your signal and refresh the page.</p>';bar.hidden=true;return;}
 if(!i||!i.open){app.innerHTML='<h1>Sales <span>closed</span></h1><p class="lead">Ticket sales for Fight Night have closed.</p>';bar.hidden=true;return;}
 P=i.prices;AGREE=(i.agreement&&i.agreement.text)||"";FIGHTERS=(i.fighters||[]).map(function(f){FID[f.name]=f.id;return f.name;});
 paint();
 var t=lsG(TOKK);if(t){try{var v=await rpc("fn_buy_view",{p_token:t});var pd=v&&v.ok&&(v.orders||[]).filter(function(o){return o.status==="paid";})[0];if(pd){PREV={tok:t,ref:pd.ref,fighter:v.fighter};lsS(TOKK,"");keep();paint();}}catch(e){}}
}
boot();
})();
</script>
</body>
</html>
