  function renderOverview(){

  function renderMyTickets(){
    const o=state.orders.find(o=>o.id===ui.lastOrderId);
    return `<div class='pagehead'><div><div class='eyebrow'>YOUR NIGHT, CONFIRMED</div><h1>Your demo tickets.</h1><p>Admission codes and upgrades in one place.</p></div><button class='small' data-action='view' data-view='buy'>Buy more tickets</button></div>${o?`<div class='goodnote'>${esc(o.buyerName)} · Order ${esc(o.id)} · ${esc(o.email)}<br>No email was sent. This is a browser-only demo receipt.</div><div class='spacer'></div>${o.status!=='paid'?`<div class='warningnote'>${o.status==='pending'?'Payment pending. No admissions are issued and nothing is counted as revenue until the payment provider confirms the charge.':'Payment failed. No admissions were issued and no revenue was recorded. The buyer would be asked to try again.'}</div><div class='spacer'></div>`:''}<div class='ticketgrid'>${state.tickets.filter(t=>t.orderId===o.id).map(admissionCard).join('')}</div>`:`<div class='panel empty'><h3>No purchases in this demo session yet.</h3><p>Try a simulated checkout, or preview one of the seeded sample orders.</p><div class='split' style='justify-content:center'><button class='primary' data-action='view' data-view='buy'>Choose my tickets</button><button data-action='sample-ticket'>Preview a sample order</button></div></div>`}`;
  }
  function upgradeDialog(ticketId){
    const ticket=state.tickets.find(t=>t.id===ticketId);if(!ticket||ticket.status!=='active'||ticket.checkedInAt)throw new Error('This ticket cannot be upgraded.');
    const available=FN.inventory(state).filter(t=>t.priceCents>ticket.paidValueCents&&t.id!==ticket.tierId&&t.remaining>0);
    showDialog('Get closer to the action.',`<p>Upgrade ${esc(ticket.id)} from ${esc(FN.tier(state,ticket.tierId).shortName)}. You keep one ticket and the same fighter credit.</p>${available.map(t=>`<section class='upsell'><strong>${esc(t.name)}</strong><p>Pay only ${exact(t.priceCents-ticket.paidValueCents)} extra. Total paid for this admission becomes ${exact(t.priceCents)}.</p><button data-action='confirm-upgrade' data-id='${ticket.id}' data-tier='${t.id}'>Simulate upgrade · ${exact(t.priceCents-ticket.paidValueCents)}</button></section>`).join('')||`<div class='warningnote'>No higher category is currently available.</div>`}<p class='helper'>No payment is taken in the demo.</p><div class='modalfooter'><button data-action='close-dialog'>Keep my ticket</button></div>`);
  }
  function renderDoor(){
    const m=FN.metrics(state),checked=state.tickets.filter(t=>t.status==='active'&&t.checkedInAt).sort((a,b)=>b.checkedInAt.localeCompare(a.checkedInAt));
    return `<div class='doorgrid'><section class='panel'><div class='eyebrow'>ONE CODE. ONE ADMISSION.</div><h3 style='margin-top:10px'>Door check-in</h3><p>Enter a demo ticket code. Refunded and previously admitted tickets are blocked.</p><form id='door-form'><label class='formlabel' for='door-code'>Admission code</label><input id='door-code' class='door-code' placeholder='FC26-T000123' autocomplete='off' required value='${esc(ui.doorCode||'')}'><button class='ice full' type='submit'>Validate & check in</button></form><div class='spacer'></div><button class='ghost small' data-action='sample-door-code'>Load an unused sample code</button>${ui.doorResult?`<div class='gate-result ${ui.doorResult.error?'bad':''}' role='status'><h3>${ui.doorResult.error?'DO NOT ADMIT':'ADMIT ✓'}</h3><p class='no-margin'>${esc(ui.doorResult.message)}</p></div>`:''}<p class='helper'>This starter uses manual code entry. Camera scanning, signed QR codes and shared devices belong in the full Claude build.</p></section><section class='panel'><div class='paneltitle'><h3>The room is filling.</h3><span class='status paid'>${m.checkedIn} / ${m.sold} checked in</span></div><div class='progress greenbar'><span style='width:${m.sold?m.checkedIn/m.sold*100:0}%'></span></div><div class='tablewrap' style='margin-top:15px'><table class='datatable'><thead><tr><th>Ticket</th><th>Category</th><th>Entry</th></tr></thead><tbody>${checked.slice(0,10).map(t=>`<tr><td>${esc(t.id)}</td><td>${esc(FN.tier(state,t.tierId).shortName)}</td><td>${time(t.checkedInAt)}</td></tr>`).join('')}</tbody></table>${checked.length?'':`<div class='empty'>No checked-in tickets.</div>`}</div></section></div>`;
  }
  function renderSettings(){
    return `<div class='warningnote'>Demo assumptions: prices are per person; capacity is 480 tickets; no table sizes, venue seat map, hospitality inclusions or door times have been confirmed. Set those before a live build.</div><div class='spacer'></div><form id='settings-form'><div class='settingsgrid'>${state.settings.tiers.map(t=>`<section class='panel'><h3>${esc(t.shortName)}</h3><label class='formlabel' for='price-${t.id}'>Price per person · AUD</label><input id='price-${t.id}' type='number' min='.01' step='.01' required value='${(t.priceCents/100).toFixed(2)}'><label class='formlabel' for='capacity-${t.id}'>Category capacity</label><input id='capacity-${t.id}' type='number' min='0' step='1' required value='${t.capacity}'><p class='helper'>Already purchased tickets retain the amount paid. A capacity cannot be reduced below active tickets.</p></section>`).join('')}</div><div class='spacer'></div><section class='panel'><div class='formgrid'><div><label class='formlabel' for='profit-target'>Working profit target · AUD</label><input id='profit-target' type='number' min='0' step='.01' required value='${(state.settings.profitTargetCents/100).toFixed(2)}'></div><div><label class='formlabel'>Demo fee model</label><p>2% + $0.30 per successful charge. This is a simulation, not a payment provider quote. Tax is not calculated.</p></div></div><div class='modalfooter'><button class='primary' type='submit'>Save demo settings</button></div></section></form><div class='spacer'></div><section class='panel'><h3>Keep or reset the demonstration.</h3><p>Export a JSON backup, restore a valid demo backup, or reset all transactions to the original sample dataset.</p><div class='split'><button data-action='export-backup'>Export backup</button><button data-action='import-backup'>Restore backup</button><button data-action='reset-dialog'>Reset sample data</button><button data-action='export-csv' data-kind='tickets'>Export ticket ledger</button></div><p class='helper'>Admin and fighter roles are previews, not authentication. Jake and Alison need real shared accounts and a server database for live operation.</p></section>`;
  }
  function download(name,data,type='text/plain'){const direct=()=>{const url=URL.createObjectURL(new Blob([data],{type})),link=document.createElement('a');link.href=url;link.download=name;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);};if(window.claude&&typeof window.claude.use==='function'){window.claude.use('downloads').then(d=>{if(!d)return direct();return d.save({filename:name,data}).catch(e=>{if(e&&e.code==='declined')return;if(e&&(e.code==='unavailable'||e.code==='not_granted'))return direct();toast('Could not save the file: '+(e&&e.message||'unknown error'),true);});}).catch(direct);}else direct();}
  function csvCell(value){const quote=String.fromCharCode(34);let s=String(value==null?'':value);const first=s.trimStart()[0];if(typeof value==='string'&&first&&'=+-@'.includes(first))s=String.fromCharCode(39)+s;return quote+s.replaceAll(quote,quote+quote)+quote;}
  function exportCsv(kind){
    let rows;
    if(kind==='orders')rows=[['Order','Buyer','Email','Supporting fighter','Payment state','Original quantity','Active tickets','Collected AUD','Refunded AUD','Collected less refunds AUD','Date'],...state.orders.map(o=>{const m=FN.orderTotals(state,o.id);return [o.id,o.buyerName,o.email,fighterName(o.fighterId),orderStatus(o),o.quantity,m.active,m.collected/100,m.refunds/100,(m.collected-m.refunds)/100,o.at];})];
    if(kind==='tickets')rows=[['Admission code','Order','Tier','Supporting fighter','Ticket state','Paid value AUD','Checked in at'],...state.tickets.map(t=>[t.id,t.orderId,FN.tier(state,t.tierId).shortName,fighterName(t.fighterId),t.status,t.paidValueCents/100,t.checkedInAt||''])];
    if(kind==='expenses')rows=[['Expense','Category','Status','Amount AUD'],...state.expenses.map(e=>[e.label,e.category,e.status,e.amountCents/100])];
    if(kind==='fighters')rows=[['Rank','Fighter','Group','Active paid tickets','Ticket value after refunds before fees AUD','Demo target'],...FN.rankings(state).map((f,i)=>[i+1,f.name,f.group,f.count,f.valueCents/100,f.target])];
    if(!rows)throw new Error('Unknown export.');download('Fight_Night_'+kind+'.csv',rows.map(row=>row.map(csvCell).join(',')).join(String.fromCharCode(13,10)),'text/csv;charset=utf-8');toast('CSV exported.');
  }
  async function copyText(value){try{await navigator.clipboard.writeText(value);toast('Copied.');}catch{showDialog('Copy this text',`<input readonly value='${esc(value)}' aria-label='Text to copy' onclick='this.select()'><p class='helper'>Select the text and copy it manually.</p><div class='modalfooter'><button data-action='close-dialog'>Close</button></div>`);}}
  const adminActions=new Set(['order-detail','refund-dialog','confirm-refund','expense-dialog','mark-paid','remove-expense-dialog','confirm-remove-expense','admin-tab','export-backup','import-backup','reset-dialog','confirm-reset','export-csv','target-dialog']);
  document.addEventListener('click',async event=>{
    const button=event.target.closest('[data-action]');if(!button||button.disabled)return;
    const action=button.dataset.action;
    if(adminActions.has(action)&&!isAdmin()){toast('Switch to Jake or Alison for the admin preview.',true);return;}
    try{
      switch(action){
        case 'view':ui.view=button.dataset.view;render();window.scrollTo(0,0);break;
        case 'admin-tab':ui.tab=button.dataset.tab;render();break;
        case 'jump-tickets':$('#ticket-options').scrollIntoView({behavior:'smooth',block:'start'});break;
        case 'jump-cart':{const c=$('#checkout-form');if(c){c.scrollIntoView({behavior:'smooth',block:'start'});const f=c.querySelector('#fighter-search');if(f)setTimeout(()=>f.focus({preventScroll:true}),400);}break;}
        case 'choose-tier':{ui.cartTier=button.dataset.tier;const remaining=FN.inventory(state).find(t=>t.id===ui.cartTier).remaining;ui.quantity=Math.max(1,Math.min(ui.quantity,remaining));render();break;}
        case 'quantity':{const remaining=FN.inventory(state).find(t=>t.id===ui.cartTier).remaining;ui.quantity=Math.max(1,Math.min(10,remaining,ui.quantity+Number(button.dataset.delta)));render();break;}
        case 'close-dialog':closeDialog();break;
        case 'order-detail':showOrder(button.dataset.id);break;
        case 'orders-page':ui.orderPage+=Number(button.dataset.delta);$('#orders-table').innerHTML=ordersTable();break;
        case 'upgrade-dialog':upgradeDialog(button.dataset.id);break;
        case 'confirm-upgrade':{const amount=FN.upgrade(state,button.dataset.id,button.dataset.tier);closeDialog();persist();toast('Demo upgrade complete · '+exact(amount)+' extra · one admission retained.');break;}
        case 'refund-dialog':{const t=state.tickets.find(t=>t.id===button.dataset.id);if(!t||t.status!=='active')throw new Error('Ticket is already refunded.');showDialog('Refund this demo ticket?',`<p>${esc(t.id)} · ${esc(FN.tier(state,t.tierId).shortName)}</p><div class='warningnote'>Refund ${exact(t.paidValueCents)}, revoke admission, release one place and remove one fighter sales credit. Illustrative processing fees remain an event cost.</div><div class='modalfooter'><button data-action='close-dialog'>Keep ticket</button><button class='primary' data-action='confirm-refund' data-id='${t.id}'>Simulate full ticket refund</button></div>`);break;}
        case 'confirm-refund':FN.refund(state,button.dataset.id);closeDialog();persist();toast('Demo ticket refunded and admission revoked.');break;
        case 'expense-dialog':expenseDialog(button.dataset.id);break;
        case 'mark-paid':FN.markPaid(state,button.dataset.id);persist();toast('Expense marked paid.');break;
        case 'remove-expense-dialog':{const expense=state.expenses.find(e=>e.id===button.dataset.id);if(!expense)throw new Error('Expense not found.');showDialog('Remove this event cost?',`<p>${esc(expense.label)} · ${exact(expense.amountCents)}</p><p>This changes the planned event budget and working profit.</p><div class='modalfooter'><button data-action='close-dialog'>Keep expense</button><button class='primary' data-action='confirm-remove-expense' data-id='${expense.id}'>Remove expense</button></div>`);break;}
        case 'confirm-remove-expense':FN.removeExpense(state,button.dataset.id);closeDialog();persist();toast('Expense removed.');break;
        case 'fighter-view':ui.fighterIdForView=button.dataset.id;ui.view='fighter';render();window.scrollTo(0,0);break;
        case 'support-fighter':ui.fighterId=button.dataset.id;ui.fighterSearch='';ui.view='buy';render();$('#ticket-options').scrollIntoView({behavior:'smooth'});break;
        case 'copy-link':await copyText(referralUrl(button.dataset.id));break;
        case 'copy-caption':await copyText('I am part of Fight Club Fight Night at Legacy Gym, Kincumber on 19 December 2026. Come along and select '+fighterName(button.dataset.id)+' when buying your tickets.');break;
        case 'target-dialog':{const f=state.roster.find(f=>f.id===button.dataset.id);showDialog('Set fighter ticket goal',`<form id='target-form'><input type='hidden' name='fighter-id' value='${f.id}'><label class='formlabel' for='target-input'>${esc(f.name)} · target tickets</label><input id='target-input' name='target' type='number' min='0' step='1' required value='${f.target}'><div class='modalfooter'><button type='button' data-action='close-dialog'>Cancel</button><button class='primary' type='submit'>Save target</button></div></form>`);break;}
        case 'sample-ticket':ui.lastOrderId=state.orders.find(o=>o.status==='paid'&&o.ticketIds.some(id=>state.tickets.some(t=>t.id===id&&t.status==='active'&&!t.checkedInAt)))?.id;render();break;
        case 'print-ticket':{const t=state.tickets.find(t=>t.id===button.dataset.id);showDialog('Demo admission ticket',admissionCard(t)+`<div class='modalfooter'><button data-action='close-dialog'>Close</button><button class='primary' data-action='print-now'>Print</button></div>`);break;}
        case 'print-now':window.print();break;
        case 'sample-door-code':ui.doorCode=state.tickets.find(t=>t.status==='active'&&!t.checkedInAt)?.id||'';render();break;
        case 'export-csv':exportCsv(button.dataset.kind);break;
        case 'export-backup':download('Fight_Night_Demo_Backup.json',JSON.stringify(state,null,2),'application/json');toast('Backup exported.');break;
        case 'import-backup':$('#bebcb8kup-upload').value='';$('#bebcb8kup-upload').click();break;
        case 'reset-dialog':showDialog('Reset the demo?',`<p>This replaces browser changes with the original sample sales and expense data. Export a backup first if you want to keep your edits.</p><div class='modalfooter'><button data-action='close-dialog'>Keep my changes</button><button class='primary' data-action='confirm-reset'>Reset sample data</button></div>`);break;
        case 'confirm-reset':state=FN.makeState();ui.lastOrderId=null;ui.doorResult=null;closeDialog();persist();toast('Sample data restored.');break;
      }
    }catch(error){toast(error.message,true);}
  });
  document.addEventListener('input',event=>{
    const el=event.target;
    if(el.id==='buyer-name')ui.buyerName=el.value;
    if(el.id==='buyer-email')ui.email=el.value;
    if(el.id==='demo-outcome')ui.demoOutcome=el.value;
    if(el.id==='fighter-search'){ui.fighterSearch=el.value;$('#support-fighter').innerHTML=fighterOptions(ui.fighterSearch);}
    if(el.id==='orders-search'){ui.ordersSearch=el.value;ui.orderPage=1;$('#orders-table').innerHTML=ordersTable();}
    if(el.id==='rank-search'){ui.rankingSearch=el.value;$('#rank-table').innerHTML=rankingsRows();}
    if(el.id==='door-code')ui.doorCode=el.value;
  });
  document.addEventListener('change',async event=>{
    const el=event.target;
    if(el.id==='role'){ui.role=el.value;if(ui.role==='fighter')ui.view='fighter';else if(ui.role==='buyer')ui.view='buy';render();}
    if(el.id==='support-fighter')ui.fighterId=el.value==='night'?null:el.value;
    if(el.id==='order-status'){ui.orderStatus=el.value;ui.orderPage=1;$('#orders-table').innerHTML=ordersTable();}
    if(el.id==='rank-group'){ui.rankingGroup=el.value;$('#rank-table').innerHTML=rankingsRows();}
    if(el.id==='fighter-profile'){ui.fighterIdForView=el.value;render();}
    if(el.id==='backup-upload'){
      if(!isAdmin())return;const file=el.files[0];if(!file)return;
      try{if(file.size>2000000)throw new Error('Choose a demo backup smaller than 2 MB.');const incoming=FN.validateState(JSON.parse(await file.text()));state=incoming;ui.lastOrderId=null;ui.doorResult=null;persist();toast('Demo backup restored.');}catch(error){toast('Backup was not restored: '+error.message,true);}
    }
  });
  document.addEventListener('submit',event=>{
    const form=event.target;event.preventDefault();
    try{
      if(form.id==='checkout-form'){
        if(ui.fighterId===undefined)throw new Error('Choose who you are coming to see, or select Here for the night.');
        const outcome=['paid','pending','failed'].includes(ui.demoOutcome)?ui.demoOutcome:'paid';const o=FN.purchase(state,{tierId:ui.cartTier,quantity:ui.quantity,fighterId:ui.fighterId,buyerName:ui.buyerName,email:ui.email,status:outcome});ui.lastOrderId=o.id;ui.view='tickets';ui.demoOutcome='paid';persist();window.scrollTo(0,0);if(outcome==='paid')toast('Demo purchase complete · '+o.quantity+' admissions issued.');else toast('Demo '+outcome+' payment recorded · no tickets issued, no revenue counted.',true);
      }
      if(form.id==='expense-form'){
        if(!isAdmin())throw new Error('Admin preview required.');const data=new FormData(form);FN.saveExpense(state,{id:data.get('expense-id')||null,label:data.get('label'),category:data.get('category'),amountCents:FN.cents(data.get('amount')),status:data.get('status')});closeDialog();persist();toast('Event cost saved.');
      }
      if(form.id==='settings-form'){
        if(!isAdmin())throw new Error('Admin preview required.');FN.saveSettings(state,{profitTargetCents:FN.cents($('#profit-target').value),tiers:state.settings.tiers.map(t=>({id:t.id,priceCents:FN.cents($('#price-'+t.id).value),capacity:Number($('#capacity-'+t.id).value)}))});persist();toast('Demo settings saved.');
      }
      if(form.id==='target-form'){
        if(!isAdmin())throw new Error('Admin preview required.');const data=new FormData(form),target=Number(data.get('target')),f=state.roster.find(f=>f.id===data.get('fighter-id'));if(!Number.isInteger(target)||target<0||target>10000)throw new Error('Choose a ticket goal between 0 and 10,000.');f.target=target;FN.audit(state,'Fighter target updated · '+f.name);closeDialog();persist();toast('Fighter goal saved.');
      }
      if(form.id==='door-form'){
        if(!isAdmin())throw new Error('Admin preview required.');
        try{const ticket=FN.checkIn(state,$('#door-code').value);ui.doorResult={error:false,message:ticket.id+' · '+state.orders.find(o=>o.id===ticket.orderId).buyerName+' · '+FN.tier(state,ticket.tierId).shortName};persist();}catch(error){ui.doorResult={error:true,message:error.message};render();}
      }
    }catch(error){toast(error.message,true);}
  });
  $('#modal').addEventListener('click',event=>{if(event.target===$('#modal')){const r=$('#modal').getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeDialog();}});
  window.FightNightDemo={getState:()=>FN.clone(state),metrics:()=>FN.metrics(state)};
  render();
})();
</script></body></html>
