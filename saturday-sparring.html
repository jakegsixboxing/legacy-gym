<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0b0c">
<title>Saturday Sparring · Legacy Gym</title>
<meta property="og:title" content="Saturday Sparring · Legacy Gym Kincumber">
<meta property="og:description" content="Saturday 9:30am at Legacy Gym Kincumber. Members and non-members welcome. Book in ten seconds.">
<meta property="og:image" content="https://legacygym-app.vercel.app/icon-512.png">
<link rel="icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Montserrat:wght@500;600;700;800&display=swap">
<style>
:root{--bg:#0b0b0c;--panel:#141312;--line:#2c271b;--gold:#c9a44c;--gold2:#f1d27a;--ink:#f2f0eb;--mute:#a39f94;--ok:#4bc97a;--bad:#ff6b7a;--spar:#d9704a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:Montserrat,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding:0 16px 40px}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 4px}
.lg{font:600 22px/1 Oswald,sans-serif;letter-spacing:3px;text-transform:uppercase;color:var(--gold)}.lg small{display:block;font-size:9px;letter-spacing:4px;margin-top:3px;color:var(--mute)}
.when{text-align:right;font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--gold)}
h1{font:700 44px/.95 Oswald,sans-serif;text-transform:uppercase;letter-spacing:.5px;margin:18px 0 8px}
h1 span{color:var(--gold)}
.sub{font-size:13.5px;line-height:1.55;color:#d9d5ca}
.list{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.c{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.c.done{border-color:var(--ok)}
.c.past{opacity:.45}
.tm{flex:none;width:58px;text-align:center}.tm b{display:block;font:700 24px/1 Oswald,sans-serif;font-variant-numeric:tabular-nums}.tm small{display:block;font-size:9px;font-weight:800;letter-spacing:2px;color:var(--mute);margin-top:3px}
.grow{flex:1;min-width:0}
.nm{font:600 18px/1.1 Oswald,sans-serif;text-transform:uppercase;letter-spacing:.4px}
.c.spar .nm{color:var(--spar)}
.sp{font-size:11.5px;color:var(--mute);margin-top:4px;line-height:1.4}
.bk{flex:none;padding:12px 16px;border-radius:12px;border:0;background:var(--gold);color:#161307;font:700 14px/1 Oswald,sans-serif;letter-spacing:1.5px;text-transform:uppercase}
.in{flex:none;font-size:11px;font-weight:800;color:var(--ok);letter-spacing:.5px;text-align:right}
.st{flex:none;font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--mute)}
.note{margin-top:16px;font-size:12.5px;line-height:1.55;color:var(--mute)}.note b{color:var(--ink)}
.mem{display:block;margin-top:18px;padding:13px;border-radius:12px;border:1px solid var(--line);text-align:center;font-size:12.5px;font-weight:700;color:var(--gold2);text-decoration:none}
.foot{text-align:center;font-size:11px;color:var(--mute);margin-top:26px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;justify-content:center;z-index:10}
.ov.on{display:flex}
.sh{width:100%;max-width:520px;background:#121110;border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:22px 18px 30px}
.sh h2{font:700 24px/1.05 Oswald,sans-serif;text-transform:uppercase}
.sh p{font-size:13px;color:var(--mute);margin-top:6px;line-height:1.5}
label{display:block;font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--mute);margin:16px 0 6px}
input{width:100%;background:#0d0c0a;border:1px solid var(--line);border-radius:12px;padding:15px 14px;color:#fff;font-size:17px;font-family:inherit;outline:none}
input:focus{border-color:var(--gold)}input.bad{border-color:var(--bad)}
.err{color:#ffb3bc;font-size:12.5px;margin-top:8px;min-height:16px}
.go{display:block;width:100%;margin-top:10px;padding:17px;border:0;border-radius:14px;background:var(--gold);color:#161307;font:700 19px/1 Oswald,sans-serif;letter-spacing:2px;text-transform:uppercase}
.go:disabled{opacity:.5}
.x{display:block;width:100%;margin-top:10px;padding:10px;border:0;background:none;color:var(--mute);font-size:12px;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
 <div class="top"><div class="lg">Legacy<small>Gym · Kincumber</small></div><div class="when" id="when"></div></div>
 <h1>Saturday<br><span>Sparring</span></h1>
 <div class="sub">Saturday 9:30am at Legacy Gym Kincumber. Members and non-members welcome. No payment, just your name.</div>
 <div class="list" id="list"></div>
 <div class="note" id="note"></div>
 <a class="mem" id="mem" href="/">Member with the app? Book in the app instead ›</a>
 <div class="foot">Legacy Gym Kincumber</div>
</div>
<div class="ov" id="ov" onclick="if(event.target===this)closeSheet()">
 <div class="sh" role="dialog" aria-modal="true" aria-labelledby="shT">
  <h2 id="shT">Book me in</h2>
  <p id="shP"></p>
  <label for="fName">Your full name</label>
  <input id="fName" autocomplete="name" placeholder="First and last name" onkeydown="if(event.key==='Enter')book()">
  <div class="err" id="err"></div>
  <button class="go" id="go" onclick="book()">Book my spot</button>
  <button class="x" onclick="closeSheet()">Cancel</button>
 </div>
</div>
<script>
(function(){
var SB="https://jyslqxepodrseyhoppce.supabase.co/rest/v1/rpc/";
var KEY="sb_publishable_otcHJ5LC4yf-69CAoZghZA_yk_8h_we";
/* To reuse this page for another day: change DATE and CLS, and open the same date/times in class_open_book. */
var DATE="2026-11-07";
var CLS=[
 {t:"09:30",tm:"9:30",n:"Saturday Sparring",s:"Saturday 9:30am · Legacy Gym Kincumber",spar:1}
];
var KEYS="lgsat_"+DATE;
document.getElementById("mem").href="/?classes="+DATE;
/* Already signed in to the Legacy app on this phone? Go straight to the classes in the app. */
try{var tok=null;for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(/^sb-.*-auth-token$/.test(k))tok=localStorage.getItem(k);}if(tok&&/access_token/.test(tok)){location.replace("/?classes="+DATE);}}catch(e){}
var booked={},sel=null,name="";
try{booked=JSON.parse(localStorage.getItem(KEYS)||"{}")||{};name=localStorage.getItem("lgsat_name")||"";}catch(e){}
function E(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
/* Sydney wall-clock now, so the page is right whatever timezone the phone is set to */
function nowSyd(){var p=new Intl.DateTimeFormat("en-CA",{timeZone:"Australia/Sydney",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date()),o={};p.forEach(function(x){o[x.type]=x.value;});return {d:o.year+"-"+o.month+"-"+o.day,hm:(o.hour==="24"?"00":o.hour)+":"+o.minute};}
function started(c){var n=nowSyd();return n.d>DATE||(n.d===DATE&&n.hm>=c.t);}
var dLbl=new Date(DATE+"T12:00:00").toLocaleDateString("en-AU",{weekday:"short",day:"numeric",month:"short"});
document.getElementById("when").textContent=dLbl;
function paint(){
 var allPast=CLS.every(started);
 document.getElementById("list").innerHTML=CLS.map(function(c,i){var inn=booked[c.t],past=started(c);
  return '<div class="c'+(inn?' done':'')+(past&&!inn?' past':'')+(c.spar?' spar':'')+'"><div class="tm"><b>'+c.tm+'</b><small>AM</small></div><div class="grow"><div class="nm">'+E(c.n)+'</div><div class="sp">'+E(c.s)+'</div></div>'
   +(inn?'<span class="in">You\'re in ✓</span>':past?'<span class="st">Started</span>':'<button class="bk" onclick="openSheet('+i+')">Book</button>')+'</div>';}).join("");
 var n=Object.keys(booked).length;
 document.getElementById("note").innerHTML=allPast&&!n?'Saturday sparring has started. Follow the gym for the next one.':n?'<b>You\'re in. See you Saturday 9:30am.</b>':'Tap Book, put your name in, done.';
}
window.openSheet=function(i){sel=i;var c=CLS[i];document.getElementById("shT").textContent="Book me in · "+c.n;document.getElementById("shP").textContent=dLbl+" · "+c.tm+"am. We just need your full name.";var f=document.getElementById("fName");f.value=name;f.classList.remove("bad");document.getElementById("err").textContent="";document.getElementById("ov").classList.add("on");setTimeout(function(){f.focus();},50);};
window.closeSheet=function(){document.getElementById("ov").classList.remove("on");};
var busy=false;
window.book=async function(){
 if(busy||sel===null)return;var c=CLS[sel],inp=document.getElementById("fName"),err=document.getElementById("err"),go=document.getElementById("go");
 var nm=inp.value.trim().replace(/\s+/g," ");
 if(nm.length<3||nm.indexOf(" ")<0){inp.classList.add("bad");err.textContent="Full name please, first and last.";return;}
 if(started(c)){err.textContent="This one has already started. Pick another.";return;}
 inp.classList.remove("bad");err.textContent="";busy=true;go.disabled=true;go.textContent="Booking…";
 try{var r=await fetch(SB+"class_open_book",{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+KEY,"content-type":"application/json"},body:JSON.stringify({p_name:nm,p_mobile:"",p_date:DATE,p_time:c.t})});var j=await r.json();
  if(!r.ok||!j||!j.ok)throw new Error((j&&(j.message||j.error))||"Couldn't book. Try again.");
  name=nm;booked[c.t]=1;try{localStorage.setItem(KEYS,JSON.stringify(booked));localStorage.setItem("lgsat_name",nm);}catch(e){}
  closeSheet();paint();
 }catch(e){err.textContent=e.message||String(e);}
 busy=false;go.disabled=false;go.textContent="Book my spot";
};
paint();setInterval(paint,60000);
})();
</script>
</body>
</html>
