<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0b0c">
<title>Saturday Sparring · Legacy Gym</title>
<meta property="og:title" content="Saturday Sparring · Legacy Gym Kincumber">
<meta property="og:description" content="Saturday 14 November, 9:30 am. 4 rings running. Book in.">
<meta property="og:image" content="https://legacygym-app.vercel.app/icon-512.png">
<link rel="icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Oswald:wght@500;600;700&display=swap">
<style>
:root{--page:#060606;--bg:#0b0b0c;--text:#f3f1ec;--soft:#d8d2c8;--muted:#a19d92;--gold:#c9a44c;--gold2:#f1d27a;--gold-rgb:201,164,76;--spar:#e07a2f;--spar-rgb:224,122,47;--line:#2a2519;--line2:#3a3222;--panel:#141312;--card:#1b1a18;--ok:#4bc97a;--bad:#ff6b7a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--text);font-family:Montserrat,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.os{max-width:470px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom,0px))}
.os button{font-family:Montserrat,system-ui,sans-serif;cursor:pointer}
.os button:focus-visible,.os input:focus-visible,.os a:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
#phone{border:1px solid var(--line);border-radius:28px;background:radial-gradient(120% 34% at 50% -4%,rgba(var(--spar-rgb),.16),transparent 62%),var(--bg);padding:20px 16px 24px;overflow:hidden}
.eye{font-size:10.5px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--spar)}
h1{margin:6px 0 0;font:700 40px/.95 Oswald,sans-serif;text-transform:uppercase;text-wrap:balance}
h1 span{color:var(--gold2)}
.when{display:flex;align-items:stretch;gap:12px;margin:16px 0 0;border:1px solid var(--line2);border-radius:16px;background:var(--panel);padding:12px 14px}
.when .d{flex:none;display:grid;place-items:center;text-align:center;padding-right:12px;border-right:1px solid var(--line2)}
.when .d b{display:block;font:700 30px/1 Oswald,sans-serif;color:var(--gold2)}
.when .d small{display:block;font-size:9.5px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-top:3px}
.when .t b{display:block;font:700 19px/1.15 Oswald,sans-serif;letter-spacing:.5px;text-transform:uppercase}
.when .t span{display:block;font-size:12.5px;line-height:1.45;color:var(--soft);margin-top:4px}
.open{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 0}
.open span{font-size:10.5px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;border:1px solid rgba(var(--spar-rgb),.55);background:rgba(var(--spar-rgb),.10);color:#f3b98a;border-radius:99px;padding:6px 10px}
h2{margin:22px 0 10px;font:700 13px/1 Oswald,sans-serif;letter-spacing:3px;text-transform:uppercase;color:var(--gold)}
.kit{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.kit li{display:flex;justify-content:space-between;gap:12px;align-items:baseline;border-bottom:1px solid var(--line);padding:9px 0;font-size:15px;font-weight:600}
.kit li span{font-size:11.5px;color:var(--muted);font-weight:600;text-align:right}
.say{margin:14px 0 0;font-size:13px;line-height:1.55;color:var(--soft)}
.cta{display:block;width:100%;margin-top:16px;border:0;border-radius:14px;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#161307;font-weight:800;font-size:14px;letter-spacing:1.5px;text-transform:uppercase;padding:16px 12px;text-align:center;text-decoration:none}
.cta:disabled{opacity:.55}
.ghost{display:block;width:100%;margin-top:8px;border:1px solid var(--line2);border-radius:14px;background:none;color:var(--text);font-weight:800;font-size:12px;letter-spacing:1px;text-transform:uppercase;padding:13px 12px;text-align:center;text-decoration:none}
.back{background:none;border:0;color:var(--gold2);font-weight:800;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;padding:0 0 14px}
.f{display:grid;gap:14px;margin-top:16px}
.f label,.f .lab{display:block;font-size:10.5px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.f input{width:100%;min-width:0;background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:14px 12px;color:var(--text);font:600 16px Montserrat,system-ui,sans-serif}
.f input::placeholder{color:#6f6b62}
.f .bad input{border-color:var(--bad)}
.err{margin:6px 0 0;font-size:12px;color:var(--bad);font-weight:600}
.xp{display:grid;gap:6px}
.xp button{display:flex;align-items:center;gap:10px;text-align:left;background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:13px 12px;color:var(--text);font-weight:600;font-size:15px}
.xp button i{flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid #6f6b62}
.xp button[aria-checked="true"]{border-color:var(--gold);background:rgba(var(--gold-rgb),.08)}
.xp button[aria-checked="true"] i{border-color:var(--gold2);background:radial-gradient(circle,var(--gold2) 0 42%,transparent 48%)}
.f .bad .xp button{border-color:var(--bad)}
.priv{margin:14px 0 0;font-size:11.5px;line-height:1.5;color:var(--muted)}
.tick{width:62px;height:62px;border-radius:50%;background:var(--ok);display:grid;place-items:center;margin:8px 0 14px;font:700 34px/1 Oswald,sans-serif;color:#07130b}
.slip{margin-top:16px;border:1px solid var(--line2);border-radius:16px;background:var(--panel);padding:4px 14px}
.slip div{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}
.slip div:last-child{border-bottom:0}
.slip div span{color:var(--muted);font-weight:600}
.slip div b{text-align:right;font-weight:700}
.mem{display:block;margin-top:14px;text-align:center;font-size:12.5px;font-weight:700;color:var(--gold2);text-decoration:none}
.foot{text-align:center;font-size:11px;color:var(--muted);margin-top:18px}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--card);border:1px solid var(--gold);color:var(--text);font-weight:700;font-size:12.5px;padding:11px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:calc(100vw - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:360px){h1{font-size:34px}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div class="os">
  <div id="phone" aria-live="polite"></div>
  <a class="mem" href="/?classes=2026-11-14">Legacy member with the app? Book in the app instead ›</a>
  <div class="foot">Legacy Gym · Kincumber</div>
</div>
<div id="toast" role="status"></div>
<script>
(function(){
  var SB="https://jyslqxepodrseyhoppce.supabase.co/rest/v1/rpc/";
  var KEY="sb_publishable_otcHJ5LC4yf-69CAoZghZA_yk_8h_we";
  /* To reuse for another Saturday: change DATE, the day/month labels below, and open the date in class_open_book2. */
  var DATE="2026-11-14",TIME="09:30",DAY="14",DLBL="Sat 14 Nov",SKEY="lgopen_"+DATE;
  var XP=["Sparring experience","Amateur boxer","Pro boxer"];
  var S={step:"event",me:null,form:{name:"",mobile:"",gym:"",xp:""},err:{},busy:false};
  try{S.me=JSON.parse(localStorage.getItem(SKEY)||"null");var f=JSON.parse(localStorage.getItem("lgopen_me")||"null");if(f)S.form=Object.assign(S.form,f,{xp:f.xp||""});}catch(e){}
  if(S.me)S.step="done";
  var phone=document.getElementById("phone"),toastEl=document.getElementById("toast"),tt;
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function toast(t){toastEl.textContent=t;toastEl.classList.add("on");clearTimeout(tt);tt=setTimeout(function(){toastEl.classList.remove("on");},2600);}
  function tidyMobile(v){var d=String(v).replace(/\D/g,"");if(d.indexOf("61")===0&&d.length===11)d="0"+d.slice(2);if(d.length===10&&d.indexOf("04")===0)return d.slice(0,4)+" "+d.slice(4,7)+" "+d.slice(7);return null;}
  function tidyName(v){return String(v).trim().replace(/\s+/g," ");}
  function nowSyd(){var p=new Intl.DateTimeFormat("en-CA",{timeZone:"Australia/Sydney",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date()),o={};p.forEach(function(x){o[x.type]=x.value;});return {d:o.year+"-"+o.month+"-"+o.day,hm:(o.hour==="24"?"00":o.hour)+":"+o.minute};}
  function over(){var n=nowSyd();return n.d>DATE||(n.d===DATE&&n.hm>="11:30");}
  function event(){
    var booked=S.me;
    return ''
    +'<div class="eye">Legacy Gym · Kincumber</div>'
    +'<h1>Saturday <span>sparring.</span></h1>'
    +'<div class="when"><div class="d"><b>'+DAY+'</b><small>Sat · Nov</small></div>'
    +'<div class="t"><b>9:30 am start</b><span>4 rings running.</span></div></div>'
    +(over()?'<p class="say"><b>This session is done.</b> Follow the gym for the next one.</p>'
      :booked?'<button class="ghost" data-a="done">You\'re booked in. View your spot</button>'
      :'<h2>Book in</h2>'+form(true));
  }
  function fld(k,label,ph,type,mode,auto){
    var e=S.err[k];
    return '<div class="'+(e?"bad":"")+'"><label for="f_'+k+'">'+label+'</label>'
      +'<input id="f_'+k+'" type="'+type+'" inputmode="'+mode+'" autocomplete="'+auto+'" placeholder="'+ph+'" value="'+esc(S.form[k])+'"'+(e?' aria-invalid="true" aria-describedby="e_'+k+'"':'')+'>'
      +(e?'<p class="err" id="e_'+k+'">'+e+'</p>':'')+'</div>';
  }
  function xpf(){
    var e=S.err.xp;
    return '<div class="'+(e?"bad":"")+'"><div class="lab" id="xpl">Experience</div>'
      +'<div class="xp" role="radiogroup" aria-labelledby="xpl">'
      +XP.map(function(x){return '<button type="button" role="radio" aria-checked="'+(S.form.xp===x)+'" data-x="'+x+'"><i></i>'+x+'</button>';}).join("")
      +'</div>'+(e?'<p class="err">'+e+'</p>':'')+'</div>';
  }
  function form(inline){
    return ''
    +'<form class="f" id="frm" novalidate>'
    +fld("name","Full name","First and last name","text","text","name")
    +fld("mobile","Mobile number","04xx xxx xxx","tel","tel","tel")
    +(S.err.all?'<p class="err">'+esc(S.err.all)+'</p>':'')
    +'<button class="cta" type="submit"'+(S.busy?' disabled':'')+'>'+(S.busy?'Booking you in…':'Book me in')+'</button>'
    +'</form>';
  }
  function done(){
    var first=S.me.n.split(" ")[0];
    return ''
    +'<div class="tick" aria-hidden="true">✓</div>'
    +'<div class="eye">You\'re on the list</div>'
    +'<h1>See you Saturday, <span>'+esc(first)+'</span></h1>'
    +'<div class="slip">'
    +'<div><span>When</span><b>'+DLBL+', 9:30 am start</b></div>'
    +'<div><span>Where</span><b>Legacy Gym, Kincumber</b></div>'
    +'</div>'
    +'<button class="cta" data-a="share">Send the link to a mate</button>'
    +'<button class="ghost" data-a="event">Back to the details</button>';
  }
  function paint(){phone.innerHTML=(S.step==="done"&&S.me?done():event());}
  function keep(){["name","mobile"].forEach(function(k){var el=document.getElementById("f_"+k);if(el)S.form[k]=el.value;});}
  async function submit(){
    if(S.busy)return;keep();
    var e={},nm=tidyName(S.form.name),mb=tidyMobile(S.form.mobile);
    if(nm.split(" ").length<2||nm.length<3)e.name="Add your first and last name.";
    if(!mb)e.mobile="Enter a 10-digit mobile starting with 04.";
    S.err=e;
    if(e.name||e.mobile){paint();var f=document.querySelector(".f .bad input");if(f)f.focus();return;}
    S.busy=true;paint();
    try{
      var r=await fetch(SB+"class_open_book2",{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+KEY,"content-type":"application/json"},body:JSON.stringify({p_name:nm,p_mobile:mb,p_date:DATE,p_time:TIME,p_gym:null,p_xp:null})});
      var j=await r.json();
      if(!r.ok||!j||!j.ok)throw new Error((j&&(j.message||j.error))||"Couldn't book. Try again.");
      S.me={n:nm,m:mb};S.step="done";S.err={};
      try{localStorage.setItem(SKEY,JSON.stringify(S.me));localStorage.setItem("lgopen_me",JSON.stringify({name:nm,mobile:mb}));}catch(x){}
      toast(j.already?"You were already booked in":"You're booked in");
    }catch(err){S.err={all:(err&&err.message)||"Couldn't book. Check your signal and try again."};}
    S.busy=false;paint();
  }
  async function share(){
    var url=location.origin+"/saturday-sparring",text="Saturday sparring at Legacy Gym Kincumber, Sat 14 Nov 9:30 am. 4 rings running. Book in: "+url;
    if(navigator.share){try{await navigator.share({title:"Saturday Sparring · Legacy Gym",text:text,url:url});return;}catch(e){if(e&&e.name==="AbortError")return;}}
    try{await navigator.clipboard.writeText(text);toast("Link copied. Paste it to your team.");}catch(e){prompt("Copy this link:",url);}
  }
  phone.addEventListener("submit",function(ev){ev.preventDefault();submit();});
  phone.addEventListener("click",function(ev){
    var b=ev.target.closest("button");if(!b)return;
    if(b.dataset.x){keep();S.form.xp=b.dataset.x;delete S.err.xp;paint();return;}
    var a=b.dataset.a;
    if(a==="join"){S.step="form";paint();var f=document.getElementById("f_name");if(f)f.focus();}
    else if(a==="event"){if(S.step==="form")keep();S.step="event";S.err={};paint();}
    else if(a==="done"){S.step="done";paint();}
    else if(a==="share"){share();}
  });
  paint();
})();
</script>
</body>
</html>
