<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0b0c">
<title>Classes · Sat 17 Oct · Legacy Gym</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Montserrat:wght@500;600;800&display=swap">
<style>
:root{--bg:#0b0b0c;--panel:#131315;--line:#26262b;--mute:#9a9891;--ink:#f2f0eb;--gold:#C9A44C;--gold2:#F1D27A;--green:#39FF88;--red:#ff8c98}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--ink);font-family:Montserrat,system-ui,sans-serif;min-height:100%}
body{padding:18px 14px calc(30px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}.top img{height:34px}.top .k{font-size:9.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);font-weight:800}.top .t{font:600 20px/1 Oswald,sans-serif;text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.days::-webkit-scrollbar{display:none}.days div{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 12px;text-align:center;opacity:.45}.days div.on{opacity:1;border-color:var(--gold);background:#1f1a0f}.days small{display:block;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mute);font-weight:800}.days b{display:block;font:600 18px/1.1 Oswald,sans-serif;margin-top:2px}
.sec{display:flex;justify-content:space-between;font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mute);font-weight:800;margin:16px 2px 8px}
.sess{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:13px 14px;margin-bottom:10px;position:relative;overflow:hidden}
.sess .bar{position:absolute;left:0;top:0;bottom:0;width:4px;background:#e0a458}.sess.snc .bar{background:var(--gold)}.sess.spar .bar{background:#d9704a}
.sess.open{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,164,76,.12)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tm{font:600 22px/1 Oswald,sans-serif}.tm small{display:block;font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mute);font-weight:800;font-family:Montserrat,sans-serif;margin-top:4px}
.badge{font-size:9.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:4px 8px;border-radius:99px;border:1px solid #3a3a40;color:var(--mute)}.badge.hot{border-color:#6b5520;color:var(--gold2);background:#2a2211}.badge.ok{border-color:#2d5d4e;color:var(--green);background:#0f2019}
.nm{font-size:16px;font-weight:800;margin-top:8px}.cat{font-size:11px;color:var(--mute);margin-top:2px;line-height:1.5}.cat b{display:block;color:var(--gold2);letter-spacing:1px;font-size:10px}
.who{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:12px;color:#d9d3c3}.avs{display:flex}.avs i{width:24px;height:24px;border-radius:50%;border:2px solid var(--panel);margin-left:-6px;display:grid;place-items:center;font-style:normal;font-size:9px;font-weight:800;color:#111}.avs i:first-child{margin-left:0}
.cap{height:4px;background:#1f1f22;border-radius:99px;margin-top:9px;overflow:hidden}.cap i{display:block;height:100%;background:var(--gold)}
.btn{display:block;width:100%;margin-top:10px;border:0;border-radius:11px;padding:13px;font:700 14px/1 Oswald,sans-serif;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;text-align:center;text-decoration:none}
.btn.gold{background:linear-gradient(180deg,#ffe58a,#f4c95d 48%,#b8860b 52%,#ffd76a);color:#1a1200}
.btn.lock{background:#161618;color:var(--mute);border:1px solid var(--line);font-size:12px;cursor:default}
.btn.in{background:#0f2019;color:var(--green);border:1px solid #2d5d4e;cursor:default}
.note{font-size:11.5px;color:var(--mute);line-height:1.55;margin-top:12px;text-align:center}.note a{color:var(--gold2);font-weight:800}
/* name prompt */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;justify-content:center;z-index:9;padding:14px}.ov.on{display:flex}
.sheet{width:100%;max-width:520px;background:#141416;border:1px solid #3a3320;border-radius:18px;padding:18px}
.sheet h3{font:600 20px/1.1 Oswald,sans-serif;text-transform:uppercase;letter-spacing:.5px}.sheet p{font-size:12.5px;color:var(--mute);margin-top:6px;line-height:1.5}
label{display:block;font-size:10.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:#cfc6b0;margin:14px 0 6px}
input{width:100%;background:#0e0e10;border:1px solid #3a3a40;border-radius:10px;color:var(--ink);padding:13px 12px;font-family:inherit;font-size:16px}input:focus{outline:none;border-color:var(--gold)}input.bad{border-color:var(--red)}
.err{color:var(--red);font-size:12px;margin-top:8px}
.sheet .btn{margin-top:14px}.cancel{background:none;border:0;color:var(--mute);font-family:inherit;font-weight:800;font-size:12px;margin-top:10px;width:100%;cursor:pointer}
</style>
</head>
<body>
<div class="top"><img src="/img/fc/fc-logo.png" alt=""><div><div class="k">Legacy Gym Kincumber</div><div class="t">Classes</div></div></div>
<div class="days" id="days"></div>
<div class="sec"><span>Saturday — 17 Oct · 3 sessions</span><span id="secR"></span></div>
<div id="list"></div>
<p class="note">Got the Legacy app? <a href="/?classes=2026-10-17">Open this day in the app</a>. Not a member? <a href="https://www.legacygym.net/pages/start-your-free-trial" target="_blank" rel="noopener">Free class pass</a>.</p>

<div class="ov" id="ov"><div class="sheet"><h3>Book me in · Open Sparring</h3><p>Sat 17 Oct · 9:30 AM. We just need your full name so we know who's coming.</p><label>Full name</label><input id="fName" type="text" autocomplete="name" placeholder="First and last name"><div class="err" id="err"></div><button class="btn gold" id="go" onclick="book()">Book my spot</button><button class="cancel" onclick="closeSheet()">Cancel</button></div></div>

<script>
(function(){
var SB="https://jyslqxepodrseyhoppce.supabase.co/rest/v1/rpc/";
var KEY="sb_publishable_otcHJ5LC4yf-69CAoZghZA_yk_8h_we";
var DATE="2026-10-17", OPEN_T="09:30", CAP=20;
/* If this browser is already signed in to the Legacy app, go straight to Classes on that day inside the app. */
try{var tok=null;for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(/^sb-.*-auth-token$/.test(k))tok=localStorage.getItem(k);}if(tok&&/access_token/.test(tok)){location.replace("/?classes="+DATE);}}catch(e){}
var SESS=[{t:"07:30",n:"Boxing",cat:"box",lbl:"Boxing · All levels"},{t:"08:30",n:"‘GRUNT’ S&C",cat:"snc",lbl:"‘GRUNT’ Strength & Conditioning"},{t:OPEN_T,n:"Open Sparring",cat:"spar",open:true,lbl:"Open session<b>+ EVERYONE WELCOME · BRING A MOUTHGUARD</b>"}];
var COLS=["#c9a44c","#2f9e8f","#4FB8DC","#c0392b","#7d5ba6","#e0a53a"];
var roster={}, booked=null;
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m];});}
function hsh(t){var h=0;for(var i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))>>>0;return h;}
function fmtT(t){var p=t.split(":"),h=+p[0],ap=h>=12?"PM":"AM";h=h%12||12;return h+":"+p[1]+" "+ap;}
function days(){var d=new Date(2026,9,14);var out=[];for(var i=0;i<7;i++){var x=new Date(d);x.setDate(d.getDate()+i);out.push(x);}document.getElementById("days").innerHTML=out.map(function(x){var iso=x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");return '<div class="'+(iso===DATE?'on':'')+'"><small>'+x.toLocaleDateString("en-AU",{weekday:"short"})+'</small><b>'+x.getDate()+'</b></div>';}).join("");}
function paint(){
  document.getElementById("list").innerHTML=SESS.map(function(s){var r=roster[s.t]||{count:0,names:[]};var n=r.count;var pct=Math.min(100,Math.round(n/CAP*100));
    var who=n?('<b>'+r.names.map(esc).join(", ")+'</b>'+(n>r.names.length?' + '+(n-r.names.length)+' going':' going')):'<span>Be the first in.</span>';
    var badge=s.open?(booked?'<span class="badge ok">Booked ✓</span>':n>=CAP?'<span class="badge">Full</span>':'<span class="badge hot">Open to all</span>'):'<span class="badge">Members</span>';
    var btn=s.open?(booked?'<div class="btn in">You\'re in ✓ · see you Saturday</div>':n>=CAP?'<div class="btn lock">Class full</div>':'<button class="btn gold" onclick="openSheet()">Book me in</button>'):'<a class="btn lock" href="/?classes='+DATE+'">Members · book in the app</a>';
    return '<div class="sess '+s.cat+(s.open?' open':'')+'"><div class="bar"></div><div class="row"><div class="tm">'+fmtT(s.t).split(" ")[0]+'<small>'+fmtT(s.t).split(" ")[1]+' · 45 min</small></div>'+badge+'</div><div class="nm">'+esc(s.n)+'</div><div class="cat">'+s.lbl+'</div><div class="who"><div class="avs">'+r.names.map(function(x){return '<i style="background:'+COLS[hsh(x)%COLS.length]+'">'+esc(x.slice(0,2).toUpperCase())+'</i>';}).join("")+'</div><span>'+who+'</span></div><div class="cap"><i style="width:'+pct+'%"></i></div>'+btn+'</div>';}).join("");
  document.getElementById("secR").textContent=(roster[OPEN_T]?roster[OPEN_T].count:0)+" in for sparring";
}
async function load(){try{var r=await fetch(SB+"class_open_roster",{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+KEY,"content-type":"application/json"},body:JSON.stringify({p_date:DATE})});var j=await r.json();roster={};(Array.isArray(j)?j:[]).forEach(function(x){roster[x.time]={count:x.count,names:x.names||[]};});}catch(e){}paint();}
window.openSheet=function(){document.getElementById("ov").classList.add("on");setTimeout(function(){document.getElementById("fName").focus();},50);};
window.closeSheet=function(){document.getElementById("ov").classList.remove("on");};
var busy=false;
window.book=async function(){
  if(busy)return;var inp=document.getElementById("fName"),err=document.getElementById("err"),go=document.getElementById("go");
  var nm=inp.value.trim().replace(/\s+/g," ");
  if(nm.length<3||nm.indexOf(" ")<0){inp.classList.add("bad");err.textContent="Full name please, first and last.";return;}
  inp.classList.remove("bad");err.textContent="";busy=true;go.disabled=true;go.textContent="Booking…";
  try{var r=await fetch(SB+"class_open_book",{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+KEY,"content-type":"application/json"},body:JSON.stringify({p_name:nm,p_mobile:"",p_date:DATE,p_time:OPEN_T})});var j=await r.json();
    if(!r.ok||!j||!j.ok)throw new Error((j&&(j.message||j.error))||"Couldn't book. Try again.");
    booked=j.name;closeSheet();await load();window.scrollTo(0,0);
  }catch(e){err.textContent=e.message||String(e);}
  busy=false;go.disabled=false;go.textContent="Book my spot";
};
days();paint();load();
})();
</script>
</body>
</html>
