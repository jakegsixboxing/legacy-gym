<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0b0c">
<title>Ring Use Waiver · Legacy Gym</title>
<meta property="og:title" content="Legacy Gym · Ring use waiver">
<meta property="og:description" content="Read, put your name in, tap Box. Takes 30 seconds.">
<link rel="icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Montserrat:wght@500;600;700;800&display=swap">
<style>
:root{--bg:#0b0b0c;--panel:#141210;--line:#2f2a1a;--ink:#f2f0eb;--mute:#a39f94;--gold:#c9a44c;--gold2:#F1D27A;--ok:#4bc97a;--bad:#ff6b7a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Montserrat,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding:0 16px 40px}
.wrap{max-width:560px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 6px}
.lg{font:600 22px/1 Oswald,sans-serif;letter-spacing:3px;text-transform:uppercase}.lg small{display:block;font-size:9px;letter-spacing:4px;color:var(--gold);margin-top:3px}
.k{font-size:10px;font-weight:800;letter-spacing:2.4px;text-transform:uppercase;color:var(--gold)}
h1{font:700 34px/1 Oswald,sans-serif;text-transform:uppercase;letter-spacing:.5px;margin:14px 0 6px;text-wrap:balance}
.sub{font-size:13px;color:var(--mute);line-height:1.5}
.card{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.card p{font-size:14.5px;line-height:1.6;margin:0 0 12px}.card p:last-child{margin:0}
.card p b{color:var(--gold2)}
ol{padding-left:20px;font-size:14.5px;line-height:1.6}ol li{margin:0 0 10px}ol li::marker{color:var(--gold);font-weight:800}
label.l{display:block;font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--mute);margin:16px 0 6px}
input{width:100%;background:#0e0c08;border:1px solid var(--line);border-radius:12px;padding:15px 14px;color:#fff;font-size:17px;font-family:inherit;outline:none}
input:focus{border-color:var(--gold)}
.chk{display:flex;gap:12px;align-items:flex-start;margin-top:14px;font-size:13.5px;line-height:1.5;color:#e5e1d6;cursor:pointer}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--gold);margin-top:2px}
.box{display:block;width:100%;margin-top:18px;padding:20px;border:0;border-radius:16px;background:var(--gold);color:#161307;font:700 26px/1 Oswald,sans-serif;letter-spacing:4px;text-transform:uppercase;cursor:pointer}
.box:disabled{opacity:.4;cursor:default}
.fine{font-size:11.5px;color:var(--mute);line-height:1.5;margin-top:12px;text-align:center}
.err{margin-top:10px;background:rgba(255,107,122,.1);border:1px solid rgba(255,107,122,.4);color:#ffb3bc;border-radius:12px;padding:10px 12px;font-size:13px}
.done{text-align:center;padding:36px 10px}
.done .tick{width:84px;height:84px;border-radius:50%;background:rgba(75,201,122,.15);border:2px solid var(--ok);display:grid;place-items:center;margin:0 auto 18px;font-size:40px;color:var(--ok)}
.done h2{font:700 32px/1.05 Oswald,sans-serif;text-transform:uppercase}
.done p{font-size:14px;color:var(--mute);line-height:1.6;margin-top:12px}
.done b{color:var(--ink)}
.list .row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.list .row:last-child{border:0}.list .row span{color:var(--mute);font-size:12px;white-space:nowrap}
.pill{display:inline-block;background:rgba(75,201,122,.15);color:var(--ok);font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;padding:5px 10px;border-radius:99px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(function(){
var RPC="https://jyslqxepodrseyhoppce.supabase.co/rest/v1/rpc/";
var KEY="sb_publishable_otcHJ5LC4yf-69CAoZghZA_yk_8h_we";
var VERSION="ring-use-v1";
var $=function(id){return document.getElementById(id);};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m];});}
async function rpc(fn,args){var r=await fetch(RPC+fn,{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+KEY,"content-type":"application/json"},body:JSON.stringify(args||{})});var j=null;try{j=await r.json();}catch(e){}if(!r.ok)throw new Error((j&&(j.message||j.error))||("HTTP "+r.status));return j;}
var q=new URLSearchParams(location.search),key=q.get("key");
var app=$("app"),S={name:"",agree:false,busy:false,err:""};

function head(){return '<div class="top"><div class="lg">Legacy<small>Gym · Kincumber</small></div><div class="k">Ring use</div></div>';}

function form(){
 app.innerHTML=head()
 +'<h1>Using the ring today</h1><div class="sub">Read this, put your name in, tap Box. Takes about 30 seconds.</div>'
 +'<div class="card"><p>I\'m using the boxing ring and training area at Legacy Gym Kincumber today at my own request. I understand and agree that:</p><ol>'
 +'<li>I\'m <b>not a member</b> of Legacy Gym and I\'m <b>not paying</b> Legacy Gym for any service, coaching or supervision today.</li>'
 +'<li>Everyone taking part is an experienced <b>combat sports athlete or coach</b>, and we\'re organising and running the sparring ourselves.</li>'
 +'<li>Sparring and boxing training carry real risks, including <b>knockouts, concussion, cuts, broken bones and serious or permanent injury</b>. I accept those risks.</li>'
 +'<li>I <b>release Legacy Gym</b>, its owners, staff and coaches from any claim for injury, loss or damage arising from my time at the gym today, whether from sparring, training, using any equipment or weights, or simply being on the premises (including slips, trips and falls).</li>'
 +'<li>I\'m fit to train, not under the influence of alcohol or drugs, and I\'ll stop if I\'m hurt. I\'m responsible for my own gear and belongings.</li>'
 +'<li>I\'m 18 or over, and I\'m giving this agreement freely.</li></ol></div>'
 +'<label class="l">Your full name</label><input id="nm" placeholder="First and last name" autocomplete="name" value="'+esc(S.name)+'">'
 +'<label class="chk"><input type="checkbox" id="ag" '+(S.agree?'checked':'')+'><span>I\'ve read the above, I understand it, and typing my name and tapping Box is my signature.</span></label>'
 +(S.err?'<div class="err">'+esc(S.err)+'</div>':'')
 +'<button class="box" id="go" '+(S.busy?'disabled':'')+'>'+(S.busy?'Saving…':'Box')+'</button>'
 +'<div class="fine">Your name and the time are recorded and sent to Legacy Gym. Nothing else is collected.</div>';
 $("nm").oninput=function(){S.name=this.value;};
 $("ag").onchange=function(){S.agree=this.checked;};
 $("go").onclick=sign;
}
async function sign(){
 S.err="";var name=(S.name||"").trim();
 if(name.split(/\s+/).length<2){S.err="First and last name please.";form();return;}
 if(!S.agree){S.err="Tick the box to confirm you've read it.";form();return;}
 S.busy=true;form();
 try{var r=await rpc("waiver_sign",{p_name:name,p_version:VERSION,p_ua:navigator.userAgent});
  if(!r||!r.ok)throw new Error(r&&r.error==="full_name"?"First and last name please.":"Couldn't save, try again.");
  var d=new Date(r.signed_at);try{fetch('/api/fightnight?a=waiver-mail',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:r.id})});}catch(e){}
  app.innerHTML=head()+'<div class="done"><div class="tick">✓</div><h2>You\'re signed in, '+esc(name.split(/\s+/)[0])+'</h2><p>Recorded <b>'+d.toLocaleDateString("en-AU",{weekday:"short",day:"numeric",month:"short"})+' '+d.toLocaleTimeString("en-AU",{hour:"numeric",minute:"2-digit"}).toLowerCase()+'</b> and sent to Legacy Gym.</p><p>By signing you\'ve confirmed you\'re not a member or paying customer, you\'re training at your own risk with other combat sports athletes, and you\'ve <b>released Legacy Gym from any claim</b> for injury, loss or damage from today\'s session or being on the premises.</p><p style="margin-top:22px">Look after each other. Have a good session.</p></div>';
 }catch(e){S.busy=false;S.err=e.message||"Couldn't save, try again.";form();}
}
async function list(){
 app.innerHTML=head()+'<h1>Signed waivers</h1><div class="sub">Everyone who has signed the ring-use waiver, newest first.</div><div class="card list" id="L">Loading…</div>';
 try{var rows=await rpc("waiver_list",{p_key:key});
  $("L").innerHTML=rows.length?rows.map(function(r){var d=new Date(r.at);return '<div class="row"><b>'+esc(r.name)+'</b><span>'+d.toLocaleDateString("en-AU",{day:"numeric",month:"short"})+' '+d.toLocaleTimeString("en-AU",{hour:"numeric",minute:"2-digit"}).toLowerCase()+' <span class="pill">Signed</span></span></div>';}).join(""):'<p class="sub">Nobody yet.</p>';
 }catch(e){$("L").innerHTML='<p class="sub">Not available with this link.</p>';}
 setTimeout(list,20000);
}
if(key)list();else form();
})();
</script>
</body>
</html>
